# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run: cargo deny check
#
# Why cargo-deny (and not, say, hand-auditing Cargo.lock): it's one tool
# covering three separate risks the task asked for a pin/audit story on —
# known-vulnerable versions (advisories, RustSec's own DB), license
# conflicts with this workspace's AGPL-3.0-or-later (licenses), and
# duplicate/banned crates that bloat the < 30 MB image target (bans). It
# reads Cargo.lock, which is already committed at the workspace root, so
# there's nothing new to pin here — this file is policy, not pins.
#
# Paired in CI with `cargo auditable build` (see Dockerfile / deny.toml
# sibling comment there): cargo-deny is the *gate* run against source at CI
# time; cargo-auditable is what ships an equivalent dependency manifest
# *inside the built binary* so the same question ("what's in this artifact,
# and is any of it known-bad") is answerable after the fact, offline,
# without the source tree — which matters for a distroless image that
# carries no other introspection tool.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # Add RUSTSEC-XXXX-NNNN entries here only with a comment explaining why
  # the advisory doesn't apply / is accepted, and a follow-up owner. Empty
  # on purpose: nothing has been triaged yet, and CLIPPY_ADVISORY-style
  # blanket downgrades are exactly the failure mode scripts/verify.sh's own
  # comments warn against for clippy — don't repeat it here for advisories.
]

[licenses]
version = 2
# This workspace is AGPL-3.0-or-later (root Cargo.toml `[workspace.package]
# license`). A dependency under a license that cannot combine with AGPL
# (e.g. most non-(L)GPL copyleft variants with conflicting terms, or
# no-commercial-use licenses) is a real legal problem, not a lint — hence
# `deny` rather than `warn` for anything not on the allow list below.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  # `webpki-roots`, the Mozilla CA set `sc-oidc`'s HTTPS client compiles in,
  # is published under this and nothing else (checked on crates.io for both
  # 1.0.x and 0.26.x; the "pin 0.26 and get MPL-2.0" folklore is wrong). CDLA
  # is a *data* license: it covers the trust anchor list as a dataset, not as
  # code, and Permissive-2.0 is the variant with no share-alike and no
  # source-availability term at all. The recipient's only obligation is to
  # keep the disclaimer with the data, so nothing in it reaches back into a
  # combined work and it composes with this workspace's AGPL-3.0-or-later,
  # which is the only question this list exists to answer.
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "AGPL-3.0",
  "AGPL-3.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn" # image-size relevant, not a correctness gate
wildcards = "deny" # a bare "*" dependency pins nothing; that's the opposite of this file's job
# ...but every `sc-*` crate depends on its siblings by `path` with no
# `version`, which cargo-deny counts as a wildcard — 33 of them across the
# workspace, and it failed the `bans` check on nothing but those. A path
# dependency inside this workspace resolves to the source in this repo, so
# there is no version to pin and nothing unpinned about it. This exempts
# exactly that case and leaves a real registry `*` still denied.
allow-wildcard-paths = true
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
