# Stowcloud, built from this working tree instead of pulled.
#
#   docker compose -f compose.buildver.yml up -d --build
#   docker compose -f compose.buildver.yml exec sc cat /var/lib/stowcloud/setup-token
#
# Same layout and hardening as docker-compose.yml, under its own project name
# so it can run beside a released stack.

name: stowcloud-build

services:
  sc:
    build:
      context: .
      dockerfile: Dockerfile
    # The frontend is embedded in the binary, so a change under web/ needs
    # --build rather than a restart.
    image: stowcloud:dev
    restart: unless-stopped

    environment:
      PUID: 1000
      PGID: 1000

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true

    ports:
      # Loopback only. The released file is the one that publishes to the LAN.
      - "127.0.0.1:8443:8443"

    volumes:
      - sc-data:/var/lib/stowcloud
      - sc-files:/shares/files
      - sc-smb-config:/config/smb
      - sc-smb-control:/run/sc-smb

    stop_grace_period: 30s

    healthcheck:
      test: [CMD, /entrypoint.sh, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  sc-smb:
    build:
      context: .
      dockerfile: Dockerfile.smb
    image: stowcloud-smb-daemon:dev
    restart: unless-stopped

    # Bridged rather than host networking: a development stack should not claim
    # the host's port 445. Only \\NAME resolution is given up. Set
    # SC_SMB_BIND_IP to serve on a real address.
    ports:
      - "${SC_SMB_BIND_IP:-127.0.0.1}:445:445"

    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, DAC_READ_SEARCH, DAC_OVERRIDE, CHOWN]
    security_opt:
      - no-new-privileges:true

    volumes:
      - sc-smb-config:/config/smb:ro
      - sc-smb-control:/run/sc-smb
      - sc-files:/shares/files

    healthcheck:
      test: [CMD-SHELL, "smbd -b >/dev/null 2>&1 && pgrep -f /sc-smb-agent >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sc-data:
  sc-files:
  sc-smb-config:
  sc-smb-control:
