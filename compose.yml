# Stowcloud.
#
#   docker compose up -d
#   docker compose exec sc cat /var/lib/stowcloud/setup-token
#
# Then open https://localhost:8443. The certificate is self-signed on first
# run, so the browser warns once.

services:
  sc:
    image: ghcr.io/heavycaffeiner/stowcloud:stable
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    # Spent by the entrypoint becoming the service account, before the server
    # starts. Starting with `user: "1000:1000"` skips them and PUID/PGID both.
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true

    # The uid the server runs as. Match it to the owner of any folder you bind
    # mount below: `stat -c '%u:%g' /srv/my-files`.
    environment:
      PUID: 1000
      PGID: 1000

    ports:
      # TLS only. Use 127.0.0.1:8443:8443 to keep it off the LAN.
      - "8443:8443"

    volumes:
      - sc-data:/var/lib/stowcloud
      # To serve a folder you already have: - /srv/my-files:/shares/files:z
      - sc-files:/shares/files
      - sc-smb-config:/config/smb
      - sc-smb-control:/run/sc-smb

    stop_grace_period: 30s

    healthcheck:
      test: [CMD, /entrypoint.sh, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Windows and macOS file sharing. Starts with the stack and sits idle; the
  # daemon runs only while SMB is on in the admin screen, which this picks up
  # over the shared socket.
  sc-smb:
    image: ghcr.io/heavycaffeiner/stowcloud-smb-daemon:stable
    restart: unless-stopped

    # Name service is broadcast and does not cross a bridge, so \\NAME resolves
    # only on the host's network. Another SMB server on port 445 wins.
    network_mode: host

    cap_drop: [ALL]
    # smbd binds a privileged port, becomes the service account per connection
    # and reads a credential file owned by another uid. The last three are for
    # the control socket, which lives in a directory the server owns.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, DAC_READ_SEARCH, DAC_OVERRIDE, CHOWN]
    security_opt:
      - no-new-privileges:true

    volumes:
      - sc-smb-config:/config/smb:ro
      - sc-smb-control:/run/sc-smb
      # Every share has to exist here under the same path, or the client is
      # told the network name is invalid. Mount whatever sc mounts.
      - sc-files:/shares/files

    healthcheck:
      test: [CMD-SHELL, "smbd -b >/dev/null 2>&1 && pgrep -f /sc-smb-agent >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sc-data:
  sc-files:
  sc-smb-config:
  sc-smb-control:
