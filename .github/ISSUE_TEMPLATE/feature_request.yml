name: Feature request
description: Suggest an enhancement or new functionality.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Stowcloud.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or limitation are you addressing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or functionality you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have considered.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any diagrams, screenshots, protocol references, or examples.
