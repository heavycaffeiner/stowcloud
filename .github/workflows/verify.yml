name: verify

# Runs the real gate, `bash scripts/verify.sh`, on both platforms this
# workspace targets. Each job proves what it can actually prove and nothing
# else:
#
#   linux:    the deployment platform. The only place in this pipeline where
#             the openat2 path resolver, the Landlock and seccomp hardening and
#             the preview jail execute rather than merely compile. It also runs
#             the race detector, which needs a C compiler, and the browser
#             end-to-end run.
#   windows:  the mandated development platform. Proves the frontend build and
#             that a contributor's own machine can run the gate. The
#             filesystem work does not build there, and the gate reports that
#             rather than substituting a portable backend: two real bugs once
#             hid behind exactly that substitution.
#
# What this workflow does not claim: a hosted runner's kernel version and
# available security modules are whatever the runner image ships this month,
# and runners are virtual machines rather than containers, so a container
# runtime's default seccomp behaviour is exercised by the image workflow's
# smoke test rather than here.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes to the repository: it checks out, builds and
# runs the gate. Declaring the scope here pins it to that regardless of what the
# repository's default `GITHUB_TOKEN` permission is set to.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# Cancelling it frees the runner instead of queueing behind stale work.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # 24, not 22: jsdom 30 declares 24.15.0 as a floor, and corepack ships the
  # pnpm this lockfile was written by.
  NODE_VERSION: "24"
  # The toolchain CI compiles with and the module floor are both 1.27.1.
  # Hanami core establishes that floor for the shared bootstrap and Linux
  # security contracts, so local, CI, and Docker builds use the same release.
  #
  # The Dockerfiles track this value rather than the floor. An image building
  # with a different compiler from the one the gate ran means the binary that
  # ships is not the binary that was verified.
  GO_VERSION: "1.27.1"

jobs:
  linux:
    name: verify (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This runner has a C compiler, so it is where the race detector runs.
      # The detector needs cgo; the shipping build never does, and the binary
      # this produces is a test binary.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # golangci-lint keeps its analysis cache under ~/.cache, which
      # setup-go's module and build cache does not cover. Without this the
      # linter starts cold on every run and spends about a minute
      # re-analysing a tree that did not change. The key carries the pinned
      # linter version in verify.sh and the rule set it reads, since a cache
      # written by another version is discarded anyway.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('scripts/verify.sh', 'backend/.golangci.yml', 'backend/go.sum') }}
          restore-keys: ${{ runner.os }}-golangci-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      # Each before the build, so a failing unit test is reported as a failing
      # unit test and a type error as a type error, rather than as whatever the
      # build does next. `vite build` strips types with esbuild without
      # checking them, so without `pnpm check` nothing in CI ever reads the
      # types in `frontend/`.
      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check
          pnpm build

      # The end-to-end step drives a real browser, and the install does not
      # fetch one: Playwright downloads it separately, into a cache this runner
      # does not have. Without this the step failed asking to be run by hand.
      #
      # --with-deps because the runner has no shared libraries chromium needs.
      - name: Install the browser the end-to-end step drives
        run: |
          cd frontend
          pnpm exec playwright install --with-deps chromium

      - name: Check browser alignment
        working-directory: frontend
        run: pnpm test:alignment

      # The file views render a window of rows and move it as the viewport
      # scrolls. Reading that offset off the wrong element freezes the window
      # at its first screenful, which no unit test sees: the maths is right and
      # the input is wrong. This drives a real wheel over a real layout.
      - name: Check deep scrolling in the file views
        working-directory: frontend
        run: pnpm test:virtual-scroll

      # Enforces the frontend byte budgets. Deliberately
      # no Lighthouse pass (see check-bundle-size.mjs's header): a shared
      # runner's CPU/IO variance would make a frame-timing gate flaky, and
      # the budget check only claims what is actually enforced.
      - name: Check frontend bundle-size budgets
        run: |
          cd frontend
          pnpm check:bundle-size


      # This is a real external-container check, not a package-generated
      # round-trip. The fixture is checked in with provenance under the vault
      # package, so this gate cannot silently skip on a fresh checkout.
      - name: Check external VeraCrypt golden fixture
        working-directory: backend
        env:
          VAULT_INTEROP_FIXTURE: ${{ github.workspace }}/backend/internal/storage/vault/testdata/interop/hash_sha512.hc
        run: go test -count=1 ./internal/storage/vault -run '^TestOpenExternalVeraCryptFixture$' -v

      - name: bash scripts/verify.sh
        env:
          # This job installs the frontend, so a SKIP there would mean the
          # workflow broke rather than that it is absent.
          VERIFY_REQUIRE_UI: "1"
          # And it has a Go toolchain and a C compiler, so the gate's own tool
          # installs and the race run have nothing to be absent for either.
          VERIFY_REQUIRE_GOTOOLS: "1"
          VERIFY_REQUIRE_RACE: "1"
          # The frontend is built above, so the gate serves that bundle rather
          # than building it again for the embed check and the browser run.
          SC_BUNDLE_FRESH: "1"
        run: bash scripts/verify.sh

      # Runs even when the gate failed: "no space left on device" is otherwise
      # indistinguishable from a compile error in a collapsed log.
      - name: Disk
        if: always()
        run: df -h / && du -sh backend/.tools frontend/node_modules 2>/dev/null || true
  consumers:
    name: released module consumers (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify released Go modules
        run: bash checks/consumers/go/verify.sh
      - name: Verify released browser package
        run: |
          corepack enable
          bash checks/consumers/web/verify.sh

  windows:
    name: verify (windows-latest)
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job installs no C compiler. Whether the runner image ships one
      # anyway decides whether the race step runs or reports a SKIP, and it is
      # left at that deliberately: the Linux job below requires it, so this one
      # does not need to make a claim about an image it does not control.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('scripts/verify.sh', 'backend/.golangci.yml', 'backend/go.sum') }}
          restore-keys: ${{ runner.os }}-golangci-

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check
          pnpm build

      - name: Check frontend bundle-size budgets
        shell: bash
        run: |
          cd frontend
          pnpm check:bundle-size

      # No VERIFY_REQUIRE_RACE here: the race step depends on whether the image
      # happens to carry a compiler, and the Linux job requires it. The tool
      # installs are required, because a Go toolchain is installed above and
      # `go install` needs nothing else.
      - name: bash scripts/verify.sh
        shell: bash
        env:
          VERIFY_REQUIRE_UI: "1"
          VERIFY_REQUIRE_GOTOOLS: "1"
          SC_BUNDLE_FRESH: "1"
        run: bash scripts/verify.sh

      - name: Disk
        if: always()
        shell: bash
        run: df -h . && du -sh backend/.tools frontend/node_modules 2>/dev/null || true

  agentic-smoke:
    name: agentic-smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
      - name: Build frontend
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install agentic runner
        run: python -m pip install ./tools/jev-e2e
      - name: Run agentic smoke suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash scripts/e2e-agentic.sh pr
      - name: Upload agentic artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: agentic-smoke-artifacts
          path: test-results/agentic
