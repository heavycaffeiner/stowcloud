name: verify

# Runs the real gate, `bash scripts/verify.sh`, on both platforms this
# workspace targets. Each job proves what it can actually prove and nothing
# else:
#
#   linux   — the deployment platform. The only place in this pipeline where
#             the openat2 path resolver, the Landlock and seccomp hardening and
#             the preview jail execute rather than merely compile. It also runs
#             the race detector, which needs a C compiler, and the browser
#             end-to-end run.
#   windows — the mandated development platform. Proves the frontend build and
#             that a contributor's own machine can run the gate. The
#             filesystem work does not build there, and the gate reports that
#             rather than substituting a portable backend: two real bugs once
#             hid behind exactly that substitution.
#
# What this workflow does not claim: a hosted runner's kernel version and
# available security modules are whatever the runner image ships this month,
# and runners are virtual machines rather than containers, so a container
# runtime's default seccomp behaviour is exercised by the image workflow's
# smoke test rather than here.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes to the repository — it checks out, builds and
# runs the gate. Declaring the scope here pins it to that regardless of what the
# repository's default `GITHUB_TOKEN` permission is set to.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# Cancelling it frees the runner instead of queueing behind stale work.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # 24, not 22, for the same reason Dockerfile's NODE_IMAGE moved: node 22
  # bundles npm 10.9.8, which cannot `npm ci` a lockfile npm 11 wrote.
  NODE_VERSION: "24"
  # The toolchain CI compiles with, which is not the same statement go/go.mod
  # makes. That directive is the dependency floor, currently 1.25, which is the
  # highest any dependency declares: x/sys, x/crypto, x/text, x/image and
  # modernc's sqlite and libc all sit there. This is a current stable release
  # pinned so a runner does not change compilers underneath a green run. They
  # move independently, and only the floor is a compatibility promise.
  #
  # The Dockerfiles track this value rather than the floor. An image building
  # with a different compiler from the one the gate ran means the binary that
  # ships is not the binary that was verified.
  GO_VERSION: "1.26"

jobs:
  linux:
    name: verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This runner has a C compiler, so it is where the race detector runs.
      # The detector needs cgo; the shipping build never does, and the binary
      # this produces is a test binary.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Each before the build, so a failing unit test is reported as a failing
      # unit test and a type error as a type error, rather than as whatever the
      # build does next. `vite build` strips types with esbuild without
      # checking them, so without `npm run check` nothing in CI ever reads the
      # types in `web/`.
      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run test
          npm run check
          npm run build

      # Enforces the byte budgets DESIGN-FRONTEND.md §8 records. Deliberately
      # no Lighthouse pass (see check-bundle-size.mjs's header): a shared
      # runner's CPU/IO variance would make a frame-timing gate flaky, and
      # FEATURES.md #147 only claims what is actually enforced.
      - name: Check frontend bundle-size budgets
        run: |
          cd web
          npm run check:bundle-size

      - name: bash scripts/verify.sh
        env:
          # This job installs the frontend, so a SKIP there would mean the
          # workflow broke rather than that it is absent.
          VERIFY_REQUIRE_UI: "1"
          # And it has a Go toolchain and a C compiler, so the gate's own tool
          # installs and the race run have nothing to be absent for either.
          VERIFY_REQUIRE_GOTOOLS: "1"
          VERIFY_REQUIRE_RACE: "1"
        run: bash scripts/verify.sh

      # Runs even when the gate failed: "no space left on device" is otherwise
      # indistinguishable from a compile error in a collapsed log.
      - name: Disk
        if: always()
        run: df -h / && du -sh go/.tools web/node_modules 2>/dev/null || true

  windows:
    name: verify (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job installs no C compiler. Whether the runner image ships one
      # anyway decides whether the race step runs or reports a SKIP, and it is
      # left at that deliberately: the Linux job below requires it, so this one
      # does not need to make a claim about an image it does not control.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          cd web
          npm ci
          npm run test
          npm run check
          npm run build

      - name: Check frontend bundle-size budgets
        shell: bash
        run: |
          cd web
          npm run check:bundle-size

      # No VERIFY_REQUIRE_RACE here: the race step depends on whether the image
      # happens to carry a compiler, and the Linux job requires it. The tool
      # installs are required, because a Go toolchain is installed above and
      # `go install` needs nothing else.
      - name: bash scripts/verify.sh
        shell: bash
        env:
          VERIFY_REQUIRE_UI: "1"
          VERIFY_REQUIRE_GOTOOLS: "1"
        run: bash scripts/verify.sh

      - name: Disk
        if: always()
        shell: bash
        run: df -h . && du -sh go/.tools web/node_modules 2>/dev/null || true
