name: supply-chain

# Dependency pinning, an advisory check, and an SBOM.
#
#   - Pinning already exists: go.sum is committed and every build here runs
#     with the module cache verified against it, so nothing re-solves versions.
#   - The advisory check is govulncheck, which the gate already runs on every
#     push. It is not repeated here: it reports a vulnerability only when a
#     path in this code actually reaches the vulnerable function, which is a
#     stronger statement than a version comparison and is why it belongs in the
#     gate rather than in a separate job that can be ignored.
#   - The allow-list is the policy gate over the lockfile. Every direct
#     dependency is listed in go/deps.allow with the reason it is there, and
#     the gate fails when the module graph and that file disagree. A dependency
#     nobody justified cannot arrive quietly.
#
# What this workflow adds is the artefact: an SBOM in a format the common
# off-the-shelf consumers read, produced from the same module graph the build
# uses rather than from a scan of the result.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Advisories are published after a commit lands, so a check that only runs
    # on push stops being a check the moment development pauses.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  audit:
    name: govulncheck + the dependency allow-list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      # Reachability rather than a version comparison: this reports a
      # vulnerability when a path in this code reaches the vulnerable function,
      # so an advisory against a dependency nothing here calls does not become
      # a red build somebody learns to ignore.
      - name: govulncheck
        run: |
          cd go
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The module graph and the allow-list have to agree. A dependency added
      # without a recorded reason fails here.
      - name: The direct dependencies match go/deps.allow
        run: |
          cd go
          go list -m -f '{{if and (not .Main) (not .Indirect)}}{{.Path}}{{end}}' all | grep -v '^$' | sort > /tmp/have
          grep -vE '^[[:space:]]*(#|$)' deps.allow | sort > /tmp/want
          diff -u /tmp/want /tmp/have

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: a secret is just as committed when it was removed in a
      # later commit, and the default shallow clone would not see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The repository carries a .gitleaks.toml, and a policy file nothing runs
      # is a policy nobody is keeping true. This is what makes it one.
      - name: gitleaks
        run: |
          version=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  sbom:
    name: CycloneDX SBOM artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      # Built from the module graph rather than scanned out of the binary. The
      # graph is what the build actually resolved, and a scan of the result can
      # only report what it recognises.
      - name: Generate a CycloneDX SBOM
        run: |
          cd go
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest \
            mod -json -output /tmp/sbom.json

      # The shipping build is static, so the binary is the whole dependency
      # set: nothing is resolved at run time that the graph above does not
      # already name.
      - name: Confirm the shipping build is static
        run: |
          cd go
          CGO_ENABLED=0 GOOS=linux go build -o /tmp/stowcloud ./cmd/stowcloud
          file /tmp/stowcloud
          ! go version -m /tmp/stowcloud | grep -q 'CGO_ENABLED=1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: /tmp/sbom.json
