name: docker

# Builds the `sc:core` and `sc:smb` images, actually runs both, and (on master
# only) publishes what passed to GHCR. The running part is the verification
# this repo's own dev machine cannot do (no Docker on that Windows box; see the
# deploy-work report this workflow accompanies). GitHub's runners ship Docker
# preinstalled, so this is the first place any of this gets proven for real
# rather than dry-read.
#
# Nothing is published that has not first been built and smoke-tested in this
# same run: every `publish-*` job `needs:` the job that proved its image. A
# pull request runs the proving half and stops there — a fork's token has no
# write access to this registry, and an unreviewed branch has no business
# moving the `:core` tag.
#
# ---------------------------------------------------------------------------
# Two channels
# ---------------------------------------------------------------------------
# A push to master publishes the nightly channel, `:core-nightly` and
# `:smb-nightly`. A pushed `v*` tag publishes the stable channel: `:core-stable`
# and `:smb-stable`, the version-stamped `:core-<version>`, and the bare
# `:core` / `:smb` that README and every existing deployment already pull. The
# bare tags keep being written so a self-hoster who never reads this file still
# tracks releases rather than silently freezing on whatever they last pulled.
#
# Both channels also write `:core-<sha>` / `:smb-<sha>`. That is the tag to pin
# to once a deployment matters: a channel tag moves under you, a commit-stamped
# one cannot.
#
# A `v*` tag also publishes the GitHub release, from
# `docs/releases/<tag>.md` in the tagged commit. Cutting one is therefore:
# bump the version, write that file, commit, tag, push both. A tag with no
# notes file fails the run rather than publishing a release without them.
#
# `paths` filters the pull_request trigger only. Whether a path filter is even
# evaluated for a tag push is undocumented, and a release that quietly does not
# build is a worse failure than a few redundant nightly builds, so a master
# push builds unconditionally.
#
# ---------------------------------------------------------------------------
# Both architectures are built on their own hardware
# ---------------------------------------------------------------------------
# arm64 used to be a QEMU cross-build on an amd64 runner, and it cost 48
# minutes against 5 for the same Dockerfile on amd64: emulating a compiler is
# roughly a 9x penalty, and this image compiles twice over (the npm bundle and
# the server itself). Worse, an emulated image cannot be `--load`ed and run, so
# 48 minutes bought exactly one fact: that arm64 compiles and links.
#
# `ubuntu-24.04-arm` is native arm64 hardware, free for public repositories.
# It removes the emulation, and with it the reason arm64 was never actually
# executed: every architecture below now runs the same smoke test, so what
# gets published is what was proven, on the hardware it was proven on.
#
# The per-architecture pins stay. `ALPINE_DIGEST` names a *manifest* digest,
# which is platform-specific unlike a tag, so each leg of the matrix carries
# its own and one build never has to serve two. Both images take the same
# argument now that the core one is Alpine too.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.smb"
      - ".dockerignore"
      - "go/**"
      - "web/**"
      - "deploy/smb/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# The default for every job, including the ones that only build and smoke-test.
# `packages: write` is granted per-job to the `publish-*` jobs and nowhere
# else, so a compromised smoke test cannot move a published tag.
permissions:
  contents: read

env:
  # `github.repository` is already lowercase, which GHCR requires. Deriving it
  # rather than hardcoding means a fork publishes to its own namespace instead
  # of failing against one it cannot write to.
  IMAGE: ghcr.io/${{ github.repository }}
  # `image.source` is what links a GHCR package back to its repository, and
  # under AGPL-3.0 it is also the source offer travelling with the artifact —
  # `revision` pins which commit that offer refers to.
  LABELS: |
    org.opencontainers.image.source=https://github.com/${{ github.repository }}
    org.opencontainers.image.revision=${{ github.sha }}
    org.opencontainers.image.licenses=AGPL-3.0-or-later

jobs:
  build-core:
    name: build sc:core (${{ matrix.arch }}) + run + smoke test
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion. `fail-fast: true` would cancel the healthy
      # architecture the moment the other failed, which throws away the very
      # comparison that tells you whether a failure is architecture-specific.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # alpine:3.24.1, amd64 manifest. Same value as the Dockerfile's own
            # default, passed explicitly so both legs read the same way and
            # neither depends on which arch the default favours.
            alpine: sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          - arch: arm64
            runner: ubuntu-24.04-arm
            # The arm64 manifest of the same image, read off the 3.24 index the
            # same way and the same day as the amd64 one.
            alpine: sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sc:core (${{ matrix.arch }}, loaded into local Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ALPINE_DIGEST=${{ matrix.alpine }}
          load: true
          tags: sc:core-ci
          # Keyed by architecture: the two runners build different binaries from
          # the same layers, and a shared scope would have them evicting each
          # other's entries on every run.
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

      - name: Report image size against the < 30 MB target
        run: |
          docker image inspect sc:core-ci --format '{{.Size}}' | \
            awk '{printf "sc:core size: %.2f MB\n", $1/1024/1024}'
          docker history sc:core-ci --no-trunc

      - name: The image really is the architecture this job claims
        # Cheap, and it is the assumption everything below rests on. A native
        # runner that silently fell back to emulation, or a base digest pinned
        # to the wrong arch, would otherwise smoke-test one architecture while
        # the matrix leg reported another.
        run: |
          got=$(docker image inspect sc:core-ci --format '{{.Architecture}}')
          echo "image architecture: ${got}"
          [ "$got" = "${{ matrix.arch }}" ] || { echo "expected ${{ matrix.arch }}"; exit 1; }

      # The whole configuration, because there is no environment override: a
      # server whose settings come from two places is one where "what is it
      # running with" is a question rather than a file.
      #
      # The data directory is a host directory so the steps below can read the
      # generated certificate off it. A real deployment uses a named volume and
      # needs no preparation at all, which is what the compose smoke test in
      # this same job proves.
      - name: Prepare a data directory the image can write
        run: |
          mkdir -p /tmp/sc-data /tmp/sc-shares/files
          # The uid the image runs as, which cannot chown anything itself.
          # 1000 is also the runner's own uid, so this is a no-op there and is
          # kept for the deployment where it is not.
          sudo chown -R 1000:1000 /tmp/sc-data /tmp/sc-shares

      - name: Seed the settings, which live in the database
        run: |
          seed() {
            docker run --rm -i \
              -v /tmp/sc-data:/var/lib/stowcloud \
              sc:core-ci settings set "$1" >/dev/null
          }
          echo '{"bind":"0.0.0.0:8443","app_hosts":["127.0.0.1","localhost"]}' | seed network
          # The runner is a virtual machine with whatever kernel the image
          # ships this month, so a missing layer is reported on the health
          # endpoint rather than refusing to start. The container runtime's
          # default seccomp profile is the thing under test here.
          echo '{"hardening":"preferred"}' | seed security
          # The settings the server will actually load. Printed because a
          # seed that wrote and a server that reads are two different
          # things, and when they disagree the refusal downstream says
          # nothing about which one was wrong.
          docker run --rm -v /tmp/sc-data:/var/lib/stowcloud sc:core-ci settings get

      - name: Run the container
        run: |
          docker run -d --name sc-smoke \
            --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add CHOWN \
            --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:size=64m \
            -v /tmp/sc-data:/var/lib/stowcloud \
            -v /tmp/sc-shares/files:/shares/files \
            -p 127.0.0.1:8443:8443 \
            sc:core-ci

      # The certificate is generated into `data/tls`, which the server creates
      # 0700 because the private key is in it. That is the right mode and it
      # means the host cannot read the certificate beside it, so these dial
      # with `-k` and the certificate is verified separately below, out of the
      # container, where it can be read.
      - name: Wait for the server to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsSk https://127.0.0.1:8443/api/v1/system/health >/dev/null 2>&1; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became reachable"
          docker logs sc-smoke || true
          exit 1

      - name: Plain HTTP is refused, never served
        # The listener is TLS and nothing else, so a plaintext request is
        # answered with a 400 naming the mistake and no application content at
        # all. The failure this step guards against is the app being served in
        # the clear, so what is asserted is the absence of it: any 2xx or 3xx
        # here would mean something answered a plaintext request.
        #
        # An earlier build redirected instead, and this asserted the 308. That
        # is a friendlier answer and a weaker one; refusing is what this server
        # does now.
        #
        # A TLS listener may also drop the connection outright rather than
        # answer, which curl reports as status 000 and no body file. That is
        # the strongest form of the refusal being asserted, so the body is
        # only read when there is one.
        run: |
          code=$(curl -sS --max-time 5 -o /tmp/plain.out -w '%{http_code}' \
            http://127.0.0.1:8443/api/v1/system/health || true)
          echo "status: ${code}"
          case "$code" in
            2*|3*) echo "a plaintext request was answered"; exit 1 ;;
          esac
          if [ -s /tmp/plain.out ]; then
            cat /tmp/plain.out
            if grep -qi '<html\|"status"' /tmp/plain.out; then
              echo "a plaintext request received application content"
              exit 1
            fi
          fi
          echo "plain HTTP refused with no application content, as intended"

      - name: GET /api/v1/system/health
        run: |
          out=$(curl -fsSk https://127.0.0.1:8443/api/v1/system/health)
          echo "$out"
          echo "$out" | grep -q '"status"' || { echo "unexpected health body"; exit 1; }

      - name: GET / serves the SPA document
        run: |
          out=$(curl -fsSk https://127.0.0.1:8443/)
          echo "$out" | grep -qi '<html' || { echo "/ did not return an HTML document"; echo "$out"; exit 1; }

      - name: The setup route proves a fresh deployment can bootstrap
        run: |
          out=$(curl -fsSk https://127.0.0.1:8443/api/v1/system/setup)
          echo "$out"
          echo "$out" | grep -q '"required":true' || { echo "unexpected setup body: a fresh container should report setup required"; exit 1; }

      # What `-k` above gives up, done where the certificate can actually be
      # read: inside the container, by the binary that generated it. The
      # healthcheck dials its own listener over TLS and verifies the chain, so
      # a certificate that is not valid for the address it serves fails here.
      - name: The generated certificate is valid for the address it serves
        run: |
          docker exec sc-smoke /entrypoint.sh healthcheck
          echo "the server verified its own certificate over a real dial"

      - name: exec the healthcheck directly (proves it runs with no shell in the image)
        run: |
          docker exec sc-smoke /entrypoint.sh healthcheck
          echo "healthcheck subcommand exited 0"

      # A share that lists is the difference between a server that started and
      # a server that works. The sandbox is built before the shares are
      # registered, and a domain that did not grant their paths denies every
      # listing with the share table and the grants both looking correct.
      - name: The share named at setup is reachable through the sandbox
        run: |
          # The token is written to a file in the data directory and never
          # logged: a log line carrying it would put the one credential that
          # creates the administrator into whatever collects logs. The data
          # directory is bind-mounted, so the host reads it there. sudo
          # because the file is 0600 owned by the service account's uid.
          token=$(sudo cat /tmp/sc-data/setup-token | tr -d '[:space:]')
          [ -n "$token" ] || { echo "the container published no setup token"; exit 1; }
          # Status and body rather than -f: a refusal here carries the reason
          # in the body, and -f discards it and reports only the exit code.
          # The share is named here rather than created afterwards. Setup
          # grants the account every share that exists when it runs, so a
          # share created later carries no grant and its path resolves to
          # nothing: that is the "first share" the screen asks for.
          code=$(curl -sSk -o /tmp/setup.out -w '%{http_code}' \
            -X POST https://127.0.0.1:8443/api/v1/system/setup \
            -H 'content-type: application/json' \
            -d "{\"token\":\"${token}\",\"username\":\"ci\",\"password\":\"ci-smoke-password-1\",\"app_hosts\":[\"127.0.0.1\",\"localhost\"],\"trusted_proxies\":[],\"first_share\":{\"name\":\"files\",\"host\":\"/shares/files\"}}")
          echo "setup: ${code}"
          cat /tmp/setup.out || true
          case "$code" in
            2*) ;;
            *) echo "the setup route refused"; docker logs sc-smoke; exit 1 ;;
          esac
          # Origin on every cookie-bearing mutation from here on. The setup
          # response set a session cookie, and a mutating request carrying one
          # is refused without an Origin naming an app host: that is the CSRF
          # rule, and curl is not a browser, so it sends what a browser would
          # have sent.
          origin='https://127.0.0.1:8443'
          # Each request reports its own status and body. Without that a
          # refusal anywhere in the sequence arrives as one curl exit code
          # with nothing saying which call produced it.
          say() {
            echo "$1: $2"
            if [ -s /tmp/step.out ]; then cat /tmp/step.out; fi
            case "$2" in
              2*) return 0 ;;
              *) echo "the $1 request failed"; docker logs sc-smoke; exit 1 ;;
            esac
          }
          code=$(curl -sSk -o /tmp/step.out -w '%{http_code}' -c /tmp/jar \
            -X POST https://127.0.0.1:8443/api/v1/auth/login \
            -H 'content-type: application/json' -H "origin: ${origin}" \
            -d '{"login":"ci","password":"ci-smoke-password-1"}')
          say login "$code"
          code=$(curl -sSk -o /tmp/step.out -w '%{http_code}' -b /tmp/jar \
            https://127.0.0.1:8443/api/v1/auth/session)
          say session "$code"
          csrf=$(grep -oE '"csrf":"[^"]+"' /tmp/step.out | head -1 | cut -d'"' -f4)
          [ -n "$csrf" ] || { echo "no csrf token in the session"; exit 1; }
          # The sandbox is installed at boot from the shares stored then, and
          # a Landlock domain cannot be widened afterwards. The domain grants
          # each share's parent, so a second share added later is reachable
          # without a restart, but the first one on a deployment that booted
          # with none is not: nothing had put /shares in the domain. A
          # restart is what a deployment does here, and proves the share
          # survives one.
          docker restart sc-smoke >/dev/null
          for i in $(seq 1 30); do
            if curl -fsSk https://127.0.0.1:8443/api/v1/system/health >/dev/null 2>&1; then
              echo "back up after ${i}s"
              break
            fi
            sleep 1
          done
          code=$(curl -sSk -o /tmp/step.out -w '%{http_code}' -b /tmp/jar \
            'https://127.0.0.1:8443/api/v1/files/list?path=/files')
          say list "$code"
          grep -q '"dir_etag"' /tmp/step.out || { echo "the share does not list"; exit 1; }

      - name: Wait for Docker's own HEALTHCHECK to report healthy
        # Proves the Dockerfile's HEALTHCHECK instruction itself, not just
        # the binary in isolation. The probe is the exec form calling the
        # server binary under a different argument, so this is the one part
        # that can only be proven inside a real container.
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sc-smoke)
            echo "health status after ${i}s: ${status}"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker inspect --format='{{json .State.Health}}' sc-smoke
              exit 1
            fi
            sleep 1
          done
          echo "container never reported healthy"
          docker inspect --format='{{json .State.Health}}' sc-smoke
          exit 1

      - name: Container logs (always, for the record)
        if: always()
        run: docker logs sc-smoke || true

      - name: Teardown
        if: always()
        run: docker rm -f sc-smoke || true

  build-smb:
    name: build sc:smb (${{ matrix.arch }}) + run + smoke test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # alpine:3.24.1, amd64 manifest. The Dockerfile.smb default.
            alpine: sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          - arch: arm64
            runner: ubuntu-24.04-arm
            # alpine:3.24.1, arm64/v8 manifest, read off the `3.24` index in the
            # real registry. Passing the amd64 digest here would not have failed
            # loudly: it would have produced an amd64 image on an arm64 runner,
            # which is exactly the kind of quiet wrong answer the architecture
            # assertion below exists to catch.
            alpine: sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sc:smb (${{ matrix.arch }}, loaded into local Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ALPINE_DIGEST=${{ matrix.alpine }}
          load: true
          tags: sc:smb-ci
          cache-from: type=gha,scope=smb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smb-${{ matrix.arch }}

      - name: The image really is the architecture this job claims
        run: |
          got=$(docker image inspect sc:smb-ci --format '{{.Architecture}}')
          echo "image architecture: ${got}"
          [ "$got" = "${{ matrix.arch }}" ] || { echo "expected ${{ matrix.arch }}"; exit 1; }

      - name: Prepare a fixture /config/smb (only smb.conf — smbpasswd/passwd are optional, the agent guards both)
        run: |
          mkdir -p /tmp/sc-smbcfg /tmp/sc-shares/files
          cat > /tmp/sc-smbcfg/smb.conf <<'EOF'
          [global]
             workgroup = WORKGROUP
             server min protocol = SMB3_11
             security = user
             bind interfaces only = yes
             interfaces = lo
             hosts allow = 127.0.0.0/8 ::1/128
             hosts deny = 0.0.0.0/0

          [files]
             path = /shares/files
             read only = no
             valid users = alice
          EOF

      - name: Run the container
        # The same cap set docker-compose.yml ships. Running it here is what
        # turns that list from a claim into something checked, and it is now
        # checked on both architectures rather than on amd64 alone. NET_ADMIN is
        # not in it, so this also covers the agent's no-ban path.
        run: |
          docker run -d --name sc-smb-smoke \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges:true \
            -v /tmp/sc-smbcfg:/config/smb:ro \
            -v /tmp/sc-shares/files:/shares/files \
            -p 127.0.0.1:445:445 \
            sc:smb-ci

      - name: Wait for smbd to accept the fixture config and start listening
        run: |
          for i in $(seq 1 30); do
            if docker exec sc-smb-smoke pgrep -x smbd >/dev/null 2>&1; then
              echo "smbd running after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "smbd never started"
          docker logs sc-smb-smoke || true
          exit 1

      - name: Confirm the fixture config was actually promoted (proves testparm validation + injected logging directive)
        run: |
          docker exec sc-smb-smoke cat /etc/samba/smb.conf
          docker exec sc-smb-smoke grep -q "\[files\]" /etc/samba/smb.conf
          docker exec sc-smb-smoke grep -q 'log file = /var/log/samba/log.smbd' /etc/samba/smb.conf

      - name: The loopback-only baseline was expanded from the container's own interfaces
        # sc-core renders `interfaces = lo` / `hosts allow = 127.0.0.0/8 ::1/128`
        # and the agent's scope detection is what widens them. If it silently
        # did nothing the config would still be valid and smbd would still
        # start, so the smoke test above cannot tell the two apart; these greps
        # can. That is not hypothetical: the shell version this replaced read
        # the interfaces through `ip addr show`, an image without `ip` produced
        # an empty scan, and SMB answered on loopback for the life of the
        # container with nothing logged anywhere.
        #
        # This container is bridged, which is the namespaced case: only a veth
        # is visible, so `interfaces` picks up that one device and `hosts allow`
        # falls back to private space wholesale. `ALL` must not appear, since no
        # network.policy was written and the default is no public bind.
        run: |
          conf=$(docker exec sc-smb-smoke cat /etc/samba/smb.conf)
          line=$(printf '%s\n' "$conf" | grep -E '^[[:space:]]*interfaces[[:space:]]*=')
          echo "$line"
          printf '%s\n' "$line" | grep -qE '=[[:space:]]*lo[[:space:]]+[^[:space:]]' \
            || { echo "interfaces was never expanded past lo"; exit 1; }
          line=$(printf '%s\n' "$conf" | grep -E '^[[:space:]]*hosts allow[[:space:]]*=')
          echo "$line"
          printf '%s\n' "$line" | grep -q '10\.0\.0\.0/8' \
            || { echo "hosts allow did not widen for a bridged container"; exit 1; }
          if printf '%s\n' "$line" | grep -qw 'ALL'; then
            echo "hosts allow admits ALL without allow_public_bind"
            exit 1
          fi
          echo "scope expansion confirmed"

      - name: Port 445 is reachable
        run: |
          for i in $(seq 1 15); do
            if (exec 3<>/dev/tcp/127.0.0.1/445) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "445 reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "445 never became reachable"
          docker logs sc-smb-smoke || true
          exit 1

      - name: A share path that does not exist in this container is reported by name
        # The failure this is here for: sc-core renders `path =` from its own
        # filesystem, the sidecar serves it from a different one, and testparm
        # does not check that the directory exists. The client is told the
        # network name is invalid and every file on the sc-core side looks
        # right. The agent says which path it is.
        run: |
          cat >> /tmp/sc-smbcfg/smb.conf <<'EOF'

          [nowhere]
             path = /shares/not-mounted
             valid users = alice
          EOF
          for i in $(seq 1 15); do
            if docker logs sc-smb-smoke 2>&1 | grep -q '/shares/not-mounted'; then
              echo "the missing path was reported after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "a missing share path was never reported"
          docker logs sc-smb-smoke || true
          exit 1

      - name: A syntactically broken candidate config is rejected, not promoted
        # Proves the "validate before promote" contract: a
        # bad write to the shared volume must not take the running config
        # down with it. Writes straight to the host side of the bind mount
        # (/tmp/sc-smbcfg), the same file the container sees at /config/smb
        # — not `docker cp`, which some Docker versions refuse against a
        # container path mounted `:ro`.
        run: |
          docker exec sc-smb-smoke cat /etc/samba/smb.conf > /tmp/known-good.conf
          printf '[global\n  this is not valid smb.conf syntax at all\n' > /tmp/sc-smbcfg/smb.conf
          sleep 3
          docker exec sc-smb-smoke cat /etc/samba/smb.conf > /tmp/after-broken.conf
          diff /tmp/known-good.conf /tmp/after-broken.conf
          echo "active config unchanged after a broken candidate — rejection confirmed"

      - name: Container logs (always, for the record)
        if: always()
        run: docker logs sc-smb-smoke || true

      - name: Teardown
        if: always()
        run: docker rm -f sc-smb-smoke || true

  # --- publishing ---------------------------------------------------------
  #
  # Both images ship as two-architecture manifest lists, built one architecture
  # per matrix leg rather than as a single `platforms: amd64,arm64` build. That
  # The file a person actually runs. Everything above proves the image; this
  # proves the four lines in README that tell somebody to type `docker compose
  # up -d` and expect a working server.
  #
  # Deliberately no host-side preparation: no mkdir, no chown, no editing. That
  # is the claim being tested. It held only after the image started shipping
  # the directories volumes mount over, owned by the uid it runs as, because an
  # empty named volume is created root-owned and the server is not root.
  compose:
    name: docker compose up, with nothing prepared
    needs: [build-core]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Built here rather than pulled: the point is to test this commit's
      # compose file against this commit's image, and the published tag is a
      # previous commit until this run finishes.
      - name: Build the image the compose file will run
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: stowcloud:core-dev
          cache-from: type=gha,scope=core-amd64

      # The sidecar too, because the compose file starts both. It used to sit
      # behind a profile and never came up in this job; now that the switch in
      # the interface is the only thing gating SMB, a `compose up` that could
      # not start it is exactly the failure this job exists to catch.
      - name: Build the sidecar the compose file will run
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/amd64
          load: true
          tags: stowcloud:smb-dev
          cache-from: type=gha,scope=smb-amd64

      - name: docker compose up -d
        run: |
          docker compose -f compose.buildver.yml up -d --no-build
          docker compose -f compose.buildver.yml ps

      - name: The server comes up and reports healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://127.0.0.1:8443/api/v1/system/health >/dev/null 2>&1; then
              echo "up after ${i}s"
              curl -fsSk https://127.0.0.1:8443/api/v1/system/health
              exit 0
            fi
            sleep 1
          done
          docker compose -f compose.buildver.yml logs
          exit 1

      # A share that lists, an upload that publishes, and the bytes read back.
      # Each of these was broken at some point while the container still
      # started and reported healthy, which is why the smoke test goes this far
      # rather than stopping at a 200 from the health route.
      - name: A file uploaded through the API comes back out
        run: |
          # The token is written into the data directory and never logged, so
          # it is read from the named volume through the container. The file
          # is 0600 owned by the service account, so the exec runs as the uid
          # the image was built with rather than a literal that would rot if
          # the default ever changed.
          uid=$(docker compose -f compose.buildver.yml exec -T sc printenv PUID | tr -d '[:space:]')
          gid=$(docker compose -f compose.buildver.yml exec -T sc printenv PGID | tr -d '[:space:]')
          token=$(docker compose -f compose.buildver.yml exec -T --user "${uid}:${gid}" sc \
            cat /var/lib/stowcloud/setup-token | tr -d '[:space:]')
          [ -n "$token" ] || { echo "no setup token in the data directory"; exit 1; }
          base=https://127.0.0.1:8443
          # Each request reports its own status and body, so a refusal names
          # the call that produced it rather than arriving as one exit code.
          say() {
            echo "$1: $2"
            if [ -s /tmp/step.out ]; then cat /tmp/step.out; echo; fi
            case "$2" in
              2*) return 0 ;;
              *) echo "the $1 request failed"
                 docker compose -f compose.buildver.yml logs sc
                 exit 1 ;;
            esac
          }
          # The share is named at setup, which is what grants it: setup grants
          # the account every share that exists when it runs, and one created
          # afterwards carries no grant, so its path resolves to nothing.
          code=$(curl -sSk -o /tmp/step.out -w '%{http_code}' \
            -X POST "$base/api/v1/system/setup" -H 'content-type: application/json' \
            -d "{\"token\":\"${token}\",\"username\":\"ci\",\"password\":\"ci-compose-password-1\",\"app_hosts\":[\"127.0.0.1\",\"localhost\"],\"trusted_proxies\":[],\"first_share\":{\"name\":\"files\",\"host\":\"/shares/files\"}}")
          say setup "$code"
          # Origin because the setup response set a session cookie: a mutating
          # request carrying one is refused without an Origin naming an app
          # host, which is the CSRF rule a browser satisfies for free.
          code=$(curl -sSk -o /tmp/step.out -w '%{http_code}' -c /tmp/jar \
            -X POST "$base/api/v1/auth/login" -H 'content-type: application/json' \
            -H "origin: $base" \
            -d '{"login":"ci","password":"ci-compose-password-1"}')
          say login "$code"
          code=$(curl -sSk -o /tmp/step.out -w '%{http_code}' -b /tmp/jar \
            "$base/api/v1/auth/session")
          say session "$code"
          csrf=$(sed -n 's/.*"csrf":"\([a-f0-9]*\)".*/\1/p' /tmp/step.out)
          [ -n "$csrf" ] || { echo "no csrf token in the session"; exit 1; }
          # The sandbox is installed at boot from the shares stored then and
          # cannot be widened afterwards, so the first share on a deployment
          # that booted with none is unreachable until a restart. That is
          # what a deployment does at this point, and it proves the share and
          # the session both survive one.
          docker compose -f compose.buildver.yml restart sc >/dev/null
          for i in $(seq 1 60); do
            if curl -fsSk "$base/api/v1/system/health" >/dev/null 2>&1; then
              echo "back up after ${i}s"
              break
            fi
            sleep 1
          done

          printf 'uploaded by ci\n' > /tmp/proof.txt
          size=$(stat -c%s /tmp/proof.txt)
          name=$(printf 'proof.txt' | base64 -w0)
          dest=$(printf '/files' | base64 -w0)
          code=$(curl -sSk -D/tmp/step.hdr -o /tmp/step.out -w '%{http_code}' -b /tmp/jar \
            -H "origin: $base" -H "Sc-Csrf: $csrf" \
            -H "upload-length: ${size}" \
            -H "upload-metadata: filename ${name},dest ${dest}" \
            -X POST "$base/api/v1/uploads")
          say create "$code"
          loc=$(grep -i '^location:' /tmp/step.hdr | tr -d '\r' | awk '{print $2}')
          [ -n "$loc" ] || { echo "the creation named no session"; exit 1; }
          curl -fsSk -b /tmp/jar -H "origin: $base" -H "Sc-Csrf: $csrf" \
            -H 'content-type: application/offset+octet-stream' -H 'upload-offset: 0' \
            --data-binary @/tmp/proof.txt -X PATCH "${base}${loc}" -o /dev/null

          listed=$(curl -fsSk -b /tmp/jar "$base/api/v1/files/list?path=/files")
          echo "$listed"
          echo "$listed" | grep -q 'proof.txt' \
            || { echo "the upload never reached the destination"; exit 1; }
          got=$(curl -fsSk -b /tmp/jar "$base/api/v1/files/read?path=/files/proof.txt")
          [ "$got" = "uploaded by ci" ] \
            || { echo "read back ${got}, want the bytes that were sent"; exit 1; }

      - name: Logs (always, for the record)
        if: always()
        run: docker compose -f compose.buildver.yml logs || true

      - name: Teardown
        if: always()
        run: docker compose -f compose.buildver.yml down -v || true

  # is forced by the per-architecture base digests described in this file's
  # header: one build cannot carry two of them. So each arch is pushed
  # anonymously *by digest* and a final job staples them into the tag people
  # pull. Nothing briefly owns `:core` on its own, and a run that dies halfway
  # leaves the previous tag intact rather than a half-published image.
  #
  # The digests reach the stapling job as artifacts, not as job outputs: a
  # matrix's legs share one `outputs` map and overwrite each other in it, so
  # each leg writes a file named after its own digest instead.

  publish-core:
    name: publish sc:core (${{ matrix.arch }}, by digest)
    needs: [build-core]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            alpine: sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine: sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ALPINE_DIGEST=${{ matrix.alpine }}
          labels: ${{ env.LABELS }}
          # No tag: `push-by-digest` uploads the manifest under its content
          # address only, so neither arch briefly owns `:core` on its own and
          # nobody can pull a half-published image.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Same cache scope the smoke-test leg for this arch just filled, so
          # this re-exports layers rather than recompiling them.
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

      - name: Record the digest for the stapling job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-core-${{ matrix.arch }}
          path: /tmp/digests/*
          # A missing digest must fail here rather than produce a manifest list
          # quietly containing one architecture.
          if-no-files-found: error
          retention-days: 1

  publish-core-manifest:
    name: publish sc:core (manifest list)
    needs: [publish-core]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-core-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The channel tags and an immutable one, written together. Which channel
      # depends on what was pushed; the commit-stamped tag is written either
      # way, and is what makes "which build is this" answerable after a channel
      # tag has moved on.
      - name: Staple both architectures into the pulled tags
        run: |
          cd /tmp/digests
          # Both legs, or none: a one-entry list would publish `:core` as a
          # single-architecture image and silently drop arm64 for everyone
          # already pulling it.
          count=$(ls -1 | wc -l)
          [ "$count" -eq 2 ] || { echo "expected 2 digests, found ${count}:"; ls -la; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            channel="-t ${IMAGE}:core-stable -t ${IMAGE}:core -t ${IMAGE}:core-${GITHUB_REF_NAME#v}"
          else
            channel="-t ${IMAGE}:core-nightly"
          fi
          echo "publishing ${channel}"
          docker buildx imagetools create \
            $channel \
            -t "${IMAGE}:core-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what a `docker pull` will now resolve to
        run: docker buildx imagetools inspect "${IMAGE}:core-${GITHUB_SHA}"

  publish-smb:
    name: publish sc:smb (${{ matrix.arch }}, by digest)
    needs: [build-smb]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            alpine: sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine: sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ALPINE_DIGEST=${{ matrix.alpine }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=smb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smb-${{ matrix.arch }}

      - name: Record the digest for the stapling job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-smb-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-smb-manifest:
    name: publish sc:smb (manifest list)
    needs: [publish-smb]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-smb-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Staple both architectures into the pulled tags
        run: |
          cd /tmp/digests
          count=$(ls -1 | wc -l)
          [ "$count" -eq 2 ] || { echo "expected 2 digests, found ${count}:"; ls -la; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            channel="-t ${IMAGE}:smb-stable -t ${IMAGE}:smb -t ${IMAGE}:smb-${GITHUB_REF_NAME#v}"
          else
            channel="-t ${IMAGE}:smb-nightly"
          fi
          echo "publishing ${channel}"
          docker buildx imagetools create \
            $channel \
            -t "${IMAGE}:smb-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what a `docker pull` will now resolve to
        run: docker buildx imagetools inspect "${IMAGE}:smb-${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  # The GitHub release
  # ---------------------------------------------------------------------------
  # Last, and `needs:` both manifest jobs, because the notes tell a reader to
  # `docker compose pull` and name the tags they will get. Published before the
  # images exist, that sentence is false for the six minutes the build takes,
  # and a failed build would leave a release announcing images nobody can pull.
  #
  # Living here rather than in a workflow of its own is the same reasoning the
  # `publish-*` jobs already follow: nothing is published that has not first
  # been proven in this same run.
  #
  # The notes come from a file in the tagged commit, not from the tag message
  # and not from the commit log. Release prose is long, it is read by people
  # deciding whether to upgrade, and it needs the same review as the code: a
  # tag message cannot be corrected afterwards without moving the tag, and a
  # generated changelog is a list of commit subjects, which is not that.
  release:
    name: publish the GitHub release
    needs: [publish-core-manifest, publish-smb-manifest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the release from its notes file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          # A missing file fails the run rather than falling back to something
          # generated. A release is the one artefact a self-hoster reads before
          # deciding to upgrade, and a stub is worse than a red build: the red
          # build gets fixed, the stub gets shipped.
          if [ ! -f "$notes" ]; then
            echo "::error::no release notes at ${notes}"
            echo "Write them, commit them, and move the tag onto that commit."
            exit 1
          fi
          # Idempotent, so a re-run of this workflow updates the notes instead
          # of failing on a release that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists; updating its notes"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag
          fi
