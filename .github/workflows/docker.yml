name: docker

# Builds the `sc:core` image, actually runs it, and — on master only —
# publishes what passed to GHCR. The running part is the verification this
# repo's own dev machine cannot do (no Docker on that Windows box; see the
# deploy-work report this workflow accompanies). ubuntu-latest runners ship
# Docker preinstalled, so this is the first place any of this gets proven
# for real rather than dry-read.
#
# Nothing is published that has not first been built and smoke-tested in this
# same run: every `publish-*` job `needs:` the job that proved its image. A
# pull request runs the proving half and stops there — a fork's token has no
# write access to this registry, and an unreviewed branch has no business
# moving the `:core` tag.

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "Dockerfile.smb"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/**"
      - "deploy/smb/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.smb"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/**"
      - "deploy/smb/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# The default for every job, including the ones that only build and smoke-test.
# `packages: write` is granted per-job to the four `publish-*` jobs and nowhere
# else, so a compromised smoke test cannot move a published tag.
permissions:
  contents: read

env:
  # `github.repository` is already lowercase, which GHCR requires. Deriving it
  # rather than hardcoding means a fork publishes to its own namespace instead
  # of failing against one it cannot write to.
  IMAGE: ghcr.io/${{ github.repository }}
  # `image.source` is what links a GHCR package back to its repository, and
  # under AGPL-3.0 it is also the source offer travelling with the artifact —
  # `revision` pins which commit that offer refers to.
  LABELS: |
    org.opencontainers.image.source=https://github.com/${{ github.repository }}
    org.opencontainers.image.revision=${{ github.sha }}
    org.opencontainers.image.licenses=AGPL-3.0-or-later

jobs:
  build-amd64-and-smoke:
    name: build (amd64) + run + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sc:core (amd64, loaded into local Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: sc:core-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size against the < 30 MB target (DEPLOYMENT.md §1)
        run: |
          docker image inspect sc:core-ci --format '{{.Size}}' | \
            awk '{printf "sc:core size: %.2f MB\n", $1/1024/1024}'
          docker history sc:core-ci --no-trunc

      - name: Prepare a throwaway data/secrets dir owned by uid 1000
        run: |
          mkdir -p /tmp/sc-data /tmp/sc-secrets
          sudo chown -R 1000:1000 /tmp/sc-data /tmp/sc-secrets

      - name: Run the container
        run: |
          docker run -d --name sc-smoke \
            --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:size=64m \
            -v /tmp/sc-data:/var/lib/sc \
            -v /tmp/sc-secrets:/run/sc-secrets \
            -e SC_DATA_DIR=/var/lib/sc \
            -e SC_MASTER_KEY_FILE=/run/sc-secrets/master.key \
            -p 127.0.0.1:8080:8080 \
            sc:core-ci

      - name: Wait for the server to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became reachable"
          docker logs sc-smoke || true
          exit 1

      - name: GET /api/health
        run: |
          out=$(curl -fsS http://127.0.0.1:8080/api/health)
          echo "$out"
          echo "$out" | grep -q '"status"' || { echo "unexpected /api/health body"; exit 1; }

      - name: GET / serves the SPA document
        run: |
          out=$(curl -fsS http://127.0.0.1:8080/)
          echo "$out" | grep -qi '<html' || { echo "/ did not return an HTML document"; echo "$out"; exit 1; }

      - name: GET /api/setup proves a fresh deployment can bootstrap
        run: |
          out=$(curl -fsS http://127.0.0.1:8080/api/setup)
          echo "$out"
          echo "$out" | grep -q '"required":true' || { echo "unexpected /api/setup body — a fresh container should report setup required"; exit 1; }

      - name: exec `/sc-server healthcheck` directly (proves it runs with no shell in the image)
        run: |
          docker exec sc-smoke /sc-server healthcheck
          echo "healthcheck subcommand exited 0"

      - name: Wait for Docker's own HEALTHCHECK to report healthy
        # Proves the Dockerfile's HEALTHCHECK instruction itself, not just
        # the binary in isolation. A distroless image has no shell and no
        # curl for an exec-form probe to call, so this is the one part that
        # can only be proven inside a real container.
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sc-smoke)
            echo "health status after ${i}s: ${status}"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker inspect --format='{{json .State.Health}}' sc-smoke
              exit 1
            fi
            sleep 1
          done
          echo "container never reported healthy"
          docker inspect --format='{{json .State.Health}}' sc-smoke
          exit 1

      - name: Container logs (always, for the record)
        if: always()
        run: docker logs sc-smoke || true

      - name: Teardown
        if: always()
        run: docker rm -f sc-smoke || true

  build-arm64-check:
    name: build (arm64, build-only — no runner to execute it on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build sc:core for linux/arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          # gcr.io/distroless/static-debian12:nonroot, arm64 manifest digest,
          # verified the same way and the same day as the amd64 one in the
          # Dockerfile (registry pull, not registry-API-text guess — see its
          # header comment, including the note that the previous value here
          # 404'd against the real registry).
          build-args: |
            DISTROLESS_DIGEST=sha256:37d3baf4e657ce79c144b69b69f60b8542f366a64fb7a49bd99f5444ef008bb0
          push: false
          load: false # QEMU-emulated arm64 can't be `--load`ed and run on an amd64 runner; this validates the build compiles/links, not runtime behavior
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-smb-and-smoke:
    name: build sc:smb (amd64) + run + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sc:smb (amd64, loaded into local Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/amd64
          load: true
          tags: sc:smb-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare a fixture /config/smb (only smb.conf — smbpasswd/passwd are optional, entrypoint.sh guards both)
        run: |
          mkdir -p /tmp/sc-smbcfg /tmp/sc-shares/photos
          cat > /tmp/sc-smbcfg/smb.conf <<'EOF'
          [global]
             workgroup = WORKGROUP
             server min protocol = SMB3_11
             security = user

          [photos]
             path = /shares/photos
             read only = no
             valid users = alice
          EOF

      - name: Run the container
        run: |
          docker run -d --name sc-smb-smoke \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE --cap-add SETUID --cap-add SETGID \
            --cap-add NET_ADMIN --cap-add NET_RAW \
            --security-opt no-new-privileges:true \
            -v /tmp/sc-smbcfg:/config/smb:ro \
            -v /tmp/sc-shares/photos:/shares/photos \
            -p 127.0.0.1:445:445 \
            sc:smb-ci

      - name: Wait for smbd to accept the fixture config and start listening
        run: |
          for i in $(seq 1 30); do
            if docker exec sc-smb-smoke pgrep -x smbd >/dev/null 2>&1; then
              echo "smbd running after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "smbd never started"
          docker logs sc-smb-smoke || true
          exit 1

      - name: Confirm the fixture config was actually promoted (proves testparm validation + injected logging directive)
        run: |
          docker exec sc-smb-smoke cat /etc/samba/smb.conf
          docker exec sc-smb-smoke grep -q '\[photos\]' /etc/samba/smb.conf
          docker exec sc-smb-smoke grep -q 'log file = /var/log/samba/log.smbd' /etc/samba/smb.conf

      - name: Port 445 is reachable
        run: |
          for i in $(seq 1 15); do
            if (exec 3<>/dev/tcp/127.0.0.1/445) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "445 reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "445 never became reachable"
          docker logs sc-smb-smoke || true
          exit 1

      - name: A syntactically broken candidate config is rejected, not promoted
        # Proves the "validate before promote" contract in entrypoint.sh: a
        # bad write to the shared volume must not take the running config
        # down with it. Writes straight to the host side of the bind mount
        # (/tmp/sc-smbcfg), the same file the container sees at /config/smb
        # — not `docker cp`, which some Docker versions refuse against a
        # container path mounted `:ro`.
        run: |
          docker exec sc-smb-smoke cat /etc/samba/smb.conf > /tmp/known-good.conf
          printf '[global\n  this is not valid smb.conf syntax at all\n' > /tmp/sc-smbcfg/smb.conf
          sleep 3
          docker exec sc-smb-smoke cat /etc/samba/smb.conf > /tmp/after-broken.conf
          diff /tmp/known-good.conf /tmp/after-broken.conf
          echo "active config unchanged after a broken candidate — rejection confirmed"

      - name: Container logs (always, for the record)
        if: always()
        run: docker logs sc-smb-smoke || true

      - name: Teardown
        if: always()
        run: docker rm -f sc-smb-smoke || true

  # --- publishing ---------------------------------------------------------
  #
  # `sc:core` ships as a two-architecture manifest list, and it is built one
  # architecture per job rather than as a single `platforms: amd64,arm64`
  # build. That is forced by the Dockerfile: its runtime base is pinned to a
  # *per-architecture* distroless digest (`DISTROLESS_DIGEST`), verified one
  # arch at a time by real registry pulls — see that file's header, and §14.x
  # of DEPLOYMENT.md on the two digests that turned out not to exist. One
  # build cannot carry two digests, so each arch is pushed anonymously by
  # digest and a third job staples them together into the tag people pull.

  publish-core-amd64:
    name: publish sc:core (amd64, by digest)
    needs: [build-amd64-and-smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          # No tag: `push-by-digest` uploads the manifest under its content
          # address only, so neither arch briefly owns `:core` on its own and
          # nobody can pull a half-published image.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Same cache the smoke-test job just filled, so this re-exports
          # layers rather than recompiling them.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-core-arm64:
    name: publish sc:core (arm64, by digest)
    needs: [build-arm64-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          # The arm64 distroless digest, byte-identical to the one
          # `build-arm64-check` above just built and validated with.
          build-args: |
            DISTROLESS_DIGEST=sha256:37d3baf4e657ce79c144b69b69f60b8542f366a64fb7a49bd99f5444ef008bb0
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-core-manifest:
    name: publish sc:core (manifest list)
    needs: [publish-core-amd64, publish-core-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The moving tag and an immutable one, written together. `:core` is what
      # docker-compose.yml references and what a self-hoster pulls; the
      # commit-stamped tag is what you pin to once a deployment matters, and
      # what makes "which build is this" answerable after `:core` has moved on.
      - name: Staple both architectures into the pulled tags
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:core" \
            -t "${IMAGE}:core-${GITHUB_SHA}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
        env:
          AMD64_DIGEST: ${{ needs.publish-core-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.publish-core-arm64.outputs.digest }}

      - name: Show what a `docker pull` will now resolve to
        run: docker buildx imagetools inspect "${IMAGE}:core"

  publish-smb:
    name: publish sc:smb (amd64 only)
    needs: [build-smb-and-smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-architecture on purpose, so a plain `push: true` with tags is
      # enough — no digest merge to do. The sidecar has never been built for
      # arm64 and the cap set in docker-compose.yml was verified by a real
      # smbclient session on amd64 only; publishing an arm64 image nobody has
      # run would be claiming more than has been tested.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:smb
            ${{ env.IMAGE }}:smb-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
