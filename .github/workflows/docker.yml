name: docker

# Builds the `sc:core` and `sc:smb` images, actually runs both, and (on master
# only) publishes what passed to GHCR. The running part is the verification
# this repo's own dev machine cannot do (no Docker on that Windows box; see the
# deploy-work report this workflow accompanies). GitHub's runners ship Docker
# preinstalled, so this is the first place any of this gets proven for real
# rather than dry-read.
#
# Nothing is published that has not first been built and smoke-tested in this
# same run: every `publish-*` job `needs:` the job that proved its image. A
# pull request runs the proving half and stops there — a fork's token has no
# write access to this registry, and an unreviewed branch has no business
# moving the `:core` tag.
#
# ---------------------------------------------------------------------------
# Two channels
# ---------------------------------------------------------------------------
# A push to master publishes the nightly channel, `:core-nightly` and
# `:smb-nightly`. A pushed `v*` tag publishes the stable channel: `:core-stable`
# and `:smb-stable`, the version-stamped `:core-<version>`, and the bare
# `:core` / `:smb` that README and every existing deployment already pull. The
# bare tags keep being written so a self-hoster who never reads this file still
# tracks releases rather than silently freezing on whatever they last pulled.
#
# Both channels also write `:core-<sha>` / `:smb-<sha>`. That is the tag to pin
# to once a deployment matters: a channel tag moves under you, a commit-stamped
# one cannot.
#
# A `v*` tag also publishes the GitHub release, from
# `docs/releases/<tag>.md` in the tagged commit. Cutting one is therefore:
# bump the version, write that file, commit, tag, push both. A tag with no
# notes file fails the run rather than publishing a release without them.
#
# `paths` filters the pull_request trigger only. Whether a path filter is even
# evaluated for a tag push is undocumented, and a release that quietly does not
# build is a worse failure than a few redundant nightly builds, so a master
# push builds unconditionally.
#
# ---------------------------------------------------------------------------
# Both architectures are built on their own hardware
# ---------------------------------------------------------------------------
# arm64 used to be a QEMU cross-build on an amd64 runner, and it cost 48
# minutes against 5 for the same Dockerfile on amd64: emulating a compiler is
# roughly a 9x penalty, and this image compiles twice over (the npm bundle and
# the server itself). Worse, an emulated image cannot be `--load`ed and run, so
# 48 minutes bought exactly one fact: that arm64 compiles and links.
#
# `ubuntu-24.04-arm` is native arm64 hardware, free for public repositories.
# It removes the emulation, and with it the reason arm64 was never actually
# executed: every architecture below now runs the same smoke test, so what
# gets published is what was proven, on the hardware it was proven on.
#
# The per-architecture pins stay. `DISTROLESS_DIGEST` and `ALPINE_DIGEST` name
# *manifest* digests, which are platform-specific unlike a tag, so each leg of
# the matrix carries its own and one build never has to serve two.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.smb"
      - ".dockerignore"
      - "go/**"
      - "web/**"
      - "deploy/smb/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# The default for every job, including the ones that only build and smoke-test.
# `packages: write` is granted per-job to the `publish-*` jobs and nowhere
# else, so a compromised smoke test cannot move a published tag.
permissions:
  contents: read

env:
  # `github.repository` is already lowercase, which GHCR requires. Deriving it
  # rather than hardcoding means a fork publishes to its own namespace instead
  # of failing against one it cannot write to.
  IMAGE: ghcr.io/${{ github.repository }}
  # `image.source` is what links a GHCR package back to its repository, and
  # under AGPL-3.0 it is also the source offer travelling with the artifact —
  # `revision` pins which commit that offer refers to.
  LABELS: |
    org.opencontainers.image.source=https://github.com/${{ github.repository }}
    org.opencontainers.image.revision=${{ github.sha }}
    org.opencontainers.image.licenses=AGPL-3.0-or-later

jobs:
  build-core:
    name: build sc:core (${{ matrix.arch }}) + run + smoke test
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion. `fail-fast: true` would cancel the healthy
      # architecture the moment the other failed, which throws away the very
      # comparison that tells you whether a failure is architecture-specific.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # gcr.io/distroless/static-debian12:nonroot, amd64. Same value as
            # the Dockerfile's own default, passed explicitly so both legs read
            # the same way and neither depends on which arch the default favours.
            distroless: sha256:7a2bd171a18bdd39a4729600d0dca5f16e779d41156a6908b4f8a9a289e76d92
          - arch: arm64
            runner: ubuntu-24.04-arm
            # The arm64 manifest of the same image, verified the same way and
            # the same day as the amd64 one (registry pull, not registry-API-text
            # guess; see the Dockerfile header, including the note that an
            # earlier value here 404'd against the real registry).
            distroless: sha256:37d3baf4e657ce79c144b69b69f60b8542f366a64fb7a49bd99f5444ef008bb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sc:core (${{ matrix.arch }}, loaded into local Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DISTROLESS_DIGEST=${{ matrix.distroless }}
          load: true
          tags: sc:core-ci
          # Keyed by architecture: the two runners build different binaries from
          # the same layers, and a shared scope would have them evicting each
          # other's entries on every run.
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

      - name: Report image size against the < 30 MB target (DEPLOYMENT.md §1)
        run: |
          docker image inspect sc:core-ci --format '{{.Size}}' | \
            awk '{printf "sc:core size: %.2f MB\n", $1/1024/1024}'
          docker history sc:core-ci --no-trunc

      - name: The image really is the architecture this job claims
        # Cheap, and it is the assumption everything below rests on. A native
        # runner that silently fell back to emulation, or a base digest pinned
        # to the wrong arch, would otherwise smoke-test one architecture while
        # the matrix leg reported another.
        run: |
          got=$(docker image inspect sc:core-ci --format '{{.Architecture}}')
          echo "image architecture: ${got}"
          [ "$got" = "${{ matrix.arch }}" ] || { echo "expected ${{ matrix.arch }}"; exit 1; }

      - name: Prepare a throwaway data/secrets dir owned by uid 1000
        run: |
          mkdir -p /tmp/sc-data /tmp/sc-secrets
          sudo chown -R 1000:1000 /tmp/sc-data /tmp/sc-secrets

      - name: Run the container
        run: |
          docker run -d --name sc-smoke \
            --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:size=64m \
            -v /tmp/sc-data:/var/lib/sc \
            -v /tmp/sc-secrets:/run/sc-secrets \
            -e SC_DATA_DIR=/var/lib/sc \
            -e SC_MASTER_KEY_FILE=/run/sc-secrets/master.key \
            -p 127.0.0.1:8443:8443 \
            sc:core-ci

      # `--cacert`, not `-k`. The certificate the server generated for itself is
      # on the host side of the data bind mount, so CI can verify against it for
      # real, and that verification is itself worth having: it proves the
      # generated certificate is actually valid for the address a client dials,
      # which `-k` would paper over.
      - name: Wait for the server to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --cacert /tmp/sc-data/tls/self-signed.crt \
                 https://127.0.0.1:8443/api/health >/dev/null 2>&1; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became reachable"
          docker logs sc-smoke || true
          exit 1

      - name: Plain HTTP is redirected, never served
        # The single socket detects the protocol, so plain HTTP gets a 308 to
        # the same URL over https and nothing else. Both halves are asserted:
        # the redirect, because a reset connection tells a person who typed the
        # scheme nothing at all, and the empty body, because the failure this
        # step has always guarded against is the app being served in the clear.
        run: |
          got=$(curl -sS --max-time 5 -o /dev/null \
            -w '%{http_code} %{redirect_url} %{size_download}' \
            http://127.0.0.1:8443/api/health)
          echo "$got"
          if [ "$got" != "308 https://127.0.0.1:8443/api/health 0" ]; then
            echo "expected an empty 308 to the https URL"
            exit 1
          fi
          echo "plain HTTP redirected with no body, as intended"

      - name: GET /api/health
        run: |
          out=$(curl -fsS --cacert /tmp/sc-data/tls/self-signed.crt https://127.0.0.1:8443/api/health)
          echo "$out"
          echo "$out" | grep -q '"status"' || { echo "unexpected /api/health body"; exit 1; }

      - name: GET / serves the SPA document
        run: |
          out=$(curl -fsS --cacert /tmp/sc-data/tls/self-signed.crt https://127.0.0.1:8443/)
          echo "$out" | grep -qi '<html' || { echo "/ did not return an HTML document"; echo "$out"; exit 1; }

      - name: GET /api/setup proves a fresh deployment can bootstrap
        run: |
          out=$(curl -fsS --cacert /tmp/sc-data/tls/self-signed.crt https://127.0.0.1:8443/api/setup)
          echo "$out"
          echo "$out" | grep -q '"required":true' || { echo "unexpected /api/setup body — a fresh container should report setup required"; exit 1; }

      - name: exec `/sc-server healthcheck` directly (proves it runs with no shell in the image)
        run: |
          docker exec sc-smoke /sc-server healthcheck
          echo "healthcheck subcommand exited 0"

      - name: Wait for Docker's own HEALTHCHECK to report healthy
        # Proves the Dockerfile's HEALTHCHECK instruction itself, not just
        # the binary in isolation. A distroless image has no shell and no
        # curl for an exec-form probe to call, so this is the one part that
        # can only be proven inside a real container.
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' sc-smoke)
            echo "health status after ${i}s: ${status}"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker inspect --format='{{json .State.Health}}' sc-smoke
              exit 1
            fi
            sleep 1
          done
          echo "container never reported healthy"
          docker inspect --format='{{json .State.Health}}' sc-smoke
          exit 1

      - name: Container logs (always, for the record)
        if: always()
        run: docker logs sc-smoke || true

      - name: Teardown
        if: always()
        run: docker rm -f sc-smoke || true

  build-smb:
    name: build sc:smb (${{ matrix.arch }}) + run + smoke test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # alpine:3.24.1, amd64 manifest. The Dockerfile.smb default.
            alpine: sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          - arch: arm64
            runner: ubuntu-24.04-arm
            # alpine:3.24.1, arm64/v8 manifest, read off the `3.24` index in the
            # real registry. Passing the amd64 digest here would not have failed
            # loudly: it would have produced an amd64 image on an arm64 runner,
            # which is exactly the kind of quiet wrong answer the architecture
            # assertion below exists to catch.
            alpine: sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sc:smb (${{ matrix.arch }}, loaded into local Docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ALPINE_DIGEST=${{ matrix.alpine }}
          load: true
          tags: sc:smb-ci
          cache-from: type=gha,scope=smb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smb-${{ matrix.arch }}

      - name: The image really is the architecture this job claims
        run: |
          got=$(docker image inspect sc:smb-ci --format '{{.Architecture}}')
          echo "image architecture: ${got}"
          [ "$got" = "${{ matrix.arch }}" ] || { echo "expected ${{ matrix.arch }}"; exit 1; }

      - name: Prepare a fixture /config/smb (only smb.conf — smbpasswd/passwd are optional, the agent guards both)
        run: |
          mkdir -p /tmp/sc-smbcfg /tmp/sc-shares/photos
          cat > /tmp/sc-smbcfg/smb.conf <<'EOF'
          [global]
             workgroup = WORKGROUP
             server min protocol = SMB3_11
             security = user
             bind interfaces only = yes
             interfaces = lo
             hosts allow = 127.0.0.0/8 ::1/128
             hosts deny = 0.0.0.0/0

          [photos]
             path = /shares/photos
             read only = no
             valid users = alice
          EOF

      - name: Run the container
        # The same cap set docker-compose.yml ships. Running it here is what
        # turns that list from a claim into something checked, and it is now
        # checked on both architectures rather than on amd64 alone. NET_ADMIN is
        # not in it, so this also covers the agent's no-ban path.
        run: |
          docker run -d --name sc-smb-smoke \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges:true \
            -v /tmp/sc-smbcfg:/config/smb:ro \
            -v /tmp/sc-shares/photos:/shares/photos \
            -p 127.0.0.1:445:445 \
            sc:smb-ci

      - name: Wait for smbd to accept the fixture config and start listening
        run: |
          for i in $(seq 1 30); do
            if docker exec sc-smb-smoke pgrep -x smbd >/dev/null 2>&1; then
              echo "smbd running after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "smbd never started"
          docker logs sc-smb-smoke || true
          exit 1

      - name: Confirm the fixture config was actually promoted (proves testparm validation + injected logging directive)
        run: |
          docker exec sc-smb-smoke cat /etc/samba/smb.conf
          docker exec sc-smb-smoke grep -q '\[photos\]' /etc/samba/smb.conf
          docker exec sc-smb-smoke grep -q 'log file = /var/log/samba/log.smbd' /etc/samba/smb.conf

      - name: The loopback-only baseline was expanded from the container's own interfaces
        # sc-core renders `interfaces = lo` / `hosts allow = 127.0.0.0/8 ::1/128`
        # and the agent's scope detection is what widens them. If it silently
        # did nothing the config would still be valid and smbd would still
        # start, so the smoke test above cannot tell the two apart; these greps
        # can. That is not hypothetical: the shell version this replaced read
        # the interfaces through `ip addr show`, an image without `ip` produced
        # an empty scan, and SMB answered on loopback for the life of the
        # container with nothing logged anywhere.
        #
        # This container is bridged, which is the namespaced case: only a veth
        # is visible, so `interfaces` picks up that one device and `hosts allow`
        # falls back to private space wholesale. `ALL` must not appear, since no
        # network.policy was written and the default is no public bind.
        run: |
          conf=$(docker exec sc-smb-smoke cat /etc/samba/smb.conf)
          line=$(printf '%s\n' "$conf" | grep -E '^[[:space:]]*interfaces[[:space:]]*=')
          echo "$line"
          printf '%s\n' "$line" | grep -qE '=[[:space:]]*lo[[:space:]]+[^[:space:]]' \
            || { echo "interfaces was never expanded past lo"; exit 1; }
          line=$(printf '%s\n' "$conf" | grep -E '^[[:space:]]*hosts allow[[:space:]]*=')
          echo "$line"
          printf '%s\n' "$line" | grep -q '10\.0\.0\.0/8' \
            || { echo "hosts allow did not widen for a bridged container"; exit 1; }
          if printf '%s\n' "$line" | grep -qw 'ALL'; then
            echo "hosts allow admits ALL without allow_public_bind"
            exit 1
          fi
          echo "scope expansion confirmed"

      - name: Port 445 is reachable
        run: |
          for i in $(seq 1 15); do
            if (exec 3<>/dev/tcp/127.0.0.1/445) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "445 reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "445 never became reachable"
          docker logs sc-smb-smoke || true
          exit 1

      - name: A share path that does not exist in this container is reported by name
        # The failure this is here for: sc-core renders `path =` from its own
        # filesystem, the sidecar serves it from a different one, and testparm
        # does not check that the directory exists. The client is told the
        # network name is invalid and every file on the sc-core side looks
        # right. The agent says which path it is.
        run: |
          cat >> /tmp/sc-smbcfg/smb.conf <<'EOF'

          [nowhere]
             path = /shares/not-mounted
             valid users = alice
          EOF
          for i in $(seq 1 15); do
            if docker logs sc-smb-smoke 2>&1 | grep -q '/shares/not-mounted'; then
              echo "the missing path was reported after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "a missing share path was never reported"
          docker logs sc-smb-smoke || true
          exit 1

      - name: A syntactically broken candidate config is rejected, not promoted
        # Proves the "validate before promote" contract: a
        # bad write to the shared volume must not take the running config
        # down with it. Writes straight to the host side of the bind mount
        # (/tmp/sc-smbcfg), the same file the container sees at /config/smb
        # — not `docker cp`, which some Docker versions refuse against a
        # container path mounted `:ro`.
        run: |
          docker exec sc-smb-smoke cat /etc/samba/smb.conf > /tmp/known-good.conf
          printf '[global\n  this is not valid smb.conf syntax at all\n' > /tmp/sc-smbcfg/smb.conf
          sleep 3
          docker exec sc-smb-smoke cat /etc/samba/smb.conf > /tmp/after-broken.conf
          diff /tmp/known-good.conf /tmp/after-broken.conf
          echo "active config unchanged after a broken candidate — rejection confirmed"

      - name: Container logs (always, for the record)
        if: always()
        run: docker logs sc-smb-smoke || true

      - name: Teardown
        if: always()
        run: docker rm -f sc-smb-smoke || true

  # --- publishing ---------------------------------------------------------
  #
  # Both images ship as two-architecture manifest lists, built one architecture
  # per matrix leg rather than as a single `platforms: amd64,arm64` build. That
  # is forced by the per-architecture base digests described in this file's
  # header: one build cannot carry two of them. So each arch is pushed
  # anonymously *by digest* and a final job staples them into the tag people
  # pull. Nothing briefly owns `:core` on its own, and a run that dies halfway
  # leaves the previous tag intact rather than a half-published image.
  #
  # The digests reach the stapling job as artifacts, not as job outputs: a
  # matrix's legs share one `outputs` map and overwrite each other in it, so
  # each leg writes a file named after its own digest instead.

  publish-core:
    name: publish sc:core (${{ matrix.arch }}, by digest)
    needs: [build-core]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            distroless: sha256:7a2bd171a18bdd39a4729600d0dca5f16e779d41156a6908b4f8a9a289e76d92
          - arch: arm64
            runner: ubuntu-24.04-arm
            distroless: sha256:37d3baf4e657ce79c144b69b69f60b8542f366a64fb7a49bd99f5444ef008bb0
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DISTROLESS_DIGEST=${{ matrix.distroless }}
          labels: ${{ env.LABELS }}
          # No tag: `push-by-digest` uploads the manifest under its content
          # address only, so neither arch briefly owns `:core` on its own and
          # nobody can pull a half-published image.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Same cache scope the smoke-test leg for this arch just filled, so
          # this re-exports layers rather than recompiling them.
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

      - name: Record the digest for the stapling job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-core-${{ matrix.arch }}
          path: /tmp/digests/*
          # A missing digest must fail here rather than produce a manifest list
          # quietly containing one architecture.
          if-no-files-found: error
          retention-days: 1

  publish-core-manifest:
    name: publish sc:core (manifest list)
    needs: [publish-core]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-core-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The channel tags and an immutable one, written together. Which channel
      # depends on what was pushed; the commit-stamped tag is written either
      # way, and is what makes "which build is this" answerable after a channel
      # tag has moved on.
      - name: Staple both architectures into the pulled tags
        run: |
          cd /tmp/digests
          # Both legs, or none: a one-entry list would publish `:core` as a
          # single-architecture image and silently drop arm64 for everyone
          # already pulling it.
          count=$(ls -1 | wc -l)
          [ "$count" -eq 2 ] || { echo "expected 2 digests, found ${count}:"; ls -la; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            channel="-t ${IMAGE}:core-stable -t ${IMAGE}:core -t ${IMAGE}:core-${GITHUB_REF_NAME#v}"
          else
            channel="-t ${IMAGE}:core-nightly"
          fi
          echo "publishing ${channel}"
          docker buildx imagetools create \
            $channel \
            -t "${IMAGE}:core-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what a `docker pull` will now resolve to
        run: docker buildx imagetools inspect "${IMAGE}:core-${GITHUB_SHA}"

  publish-smb:
    name: publish sc:smb (${{ matrix.arch }}, by digest)
    needs: [build-smb]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            alpine: sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine: sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.smb
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ALPINE_DIGEST=${{ matrix.alpine }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=smb-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smb-${{ matrix.arch }}

      - name: Record the digest for the stapling job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-smb-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-smb-manifest:
    name: publish sc:smb (manifest list)
    needs: [publish-smb]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-smb-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Staple both architectures into the pulled tags
        run: |
          cd /tmp/digests
          count=$(ls -1 | wc -l)
          [ "$count" -eq 2 ] || { echo "expected 2 digests, found ${count}:"; ls -la; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            channel="-t ${IMAGE}:smb-stable -t ${IMAGE}:smb -t ${IMAGE}:smb-${GITHUB_REF_NAME#v}"
          else
            channel="-t ${IMAGE}:smb-nightly"
          fi
          echo "publishing ${channel}"
          docker buildx imagetools create \
            $channel \
            -t "${IMAGE}:smb-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what a `docker pull` will now resolve to
        run: docker buildx imagetools inspect "${IMAGE}:smb-${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  # The GitHub release
  # ---------------------------------------------------------------------------
  # Last, and `needs:` both manifest jobs, because the notes tell a reader to
  # `docker compose pull` and name the tags they will get. Published before the
  # images exist, that sentence is false for the six minutes the build takes,
  # and a failed build would leave a release announcing images nobody can pull.
  #
  # Living here rather than in a workflow of its own is the same reasoning the
  # `publish-*` jobs already follow: nothing is published that has not first
  # been proven in this same run.
  #
  # The notes come from a file in the tagged commit, not from the tag message
  # and not from the commit log. Release prose is long, it is read by people
  # deciding whether to upgrade, and it needs the same review as the code: a
  # tag message cannot be corrected afterwards without moving the tag, and a
  # generated changelog is a list of commit subjects, which is not that.
  release:
    name: publish the GitHub release
    needs: [publish-core-manifest, publish-smb-manifest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the release from its notes file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          # A missing file fails the run rather than falling back to something
          # generated. A release is the one artefact a self-hoster reads before
          # deciding to upgrade, and a stub is worse than a red build: the red
          # build gets fixed, the stub gets shipped.
          if [ ! -f "$notes" ]; then
            echo "::error::no release notes at ${notes}"
            echo "Write them, commit them, and move the tag onto that commit."
            exit 1
          fi
          # Idempotent, so a re-run of this workflow updates the notes instead
          # of failing on a release that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists; updating its notes"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag
          fi
