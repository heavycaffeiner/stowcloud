# pnpm reads overrides and build approvals from here, not from package.json:
# the npm `overrides` block beside this one is invisible to it, so the pin has
# to be stated in both places or one manager silently resolves the vulnerable
# version.

# Security advisory: pin cookie to a fixed release that rejects out-of-bounds
# characters in names, paths, and domains.
overrides:
  cookie: ^0.7.2

# esbuild ships a platform binary and its install script is what puts that
# binary in place, so vite cannot build without it. Approved explicitly, since
# pnpm refuses to run any dependency's install script until it is named here.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@zip.js/zip.js@2.11.1'

# mdui's focus mixin reads its focus element in the first update. React can
# mount and remove an element inside one task, the element's ref is cleared by
# then, and the read throws. The patch skips the listeners until the element
# is connected again.
patchedDependencies:
  '@mdui/shared@1.0.9': patches/@mdui__shared@1.0.9.patch
