[workspace]
resolver = "2"
members = [
  "crates/sc-vfs",
  "crates/sc-meta",
  "crates/sc-acl",
  "crates/sc-auth",
  "crates/sc-core",
  "crates/sc-watch",
  "crates/sc-upload",
  "crates/sc-search",
  "crates/sc-preview",
  "crates/sc-http",
  "crates/sc-dav",
  "crates/sc-compat-nc",
  "crates/sc-smb",
  "crates/sc-oidc",
  "crates/sc-server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Raised from 1.85 because the lockfile already needed it: `image@0.25.10`
# and `time@0.3.54` declare 1.88.0. Nothing here was compiling on 1.85 — the
# claim was just never tested, since every machine that builds this runs a
# far newer toolchain and `cargo build` only enforces a dependency's
# `rust-version` when the toolchain is actually older.
rust-version = "1.88"
license = "AGPL-3.0-or-later"
# None of these are meant for crates.io — they are the internals of one
# server, split for compile times and boundary enforcement, not for reuse.
# Saying so also lets cargo-deny's `allow-wildcard-paths` apply: it exempts
# `path` dependencies only for crates it can see are private, since a
# published crate could not carry them.
publish = false

[workspace.dependencies]
# --- core async / http ---
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
tokio-util   = { version = "0.7", features = ["io"] }
axum         = { version = "0.8", features = ["ws", "macros"] }
tower        = "0.5"
tower-http   = { version = "0.6", features = ["compression-gzip", "set-header", "limit", "trace"] }
http         = "1"
http-body-util = "0.1"
bytes        = "1"
futures      = "0.3"

# --- outbound https (sc-oidc only, feature-gated there) ---
# This workspace had no HTTP *client* and no TLS stack at all before OIDC;
# `hyper`/`hyper-util` were in the tree purely as axum's server-side
# dependencies. The token exchange is a back-channel POST from this server to
# the IdP, so an outbound client is unavoidable. Reusing hyper instead of
# pulling `reqwest` keeps the addition to the TLS layer alone.
#
# rustls is pinned to the **ring** provider with `default-features = false`.
# The default `aws-lc-rs` wants cmake and a C toolchain, which would break
# `cargo check --target x86_64-unknown-linux-musl` (a gate this repo runs on
# every change), and ring is in the tree anyway for JWS verification.
hyper        = { version = "1", features = ["client", "http1"] }
hyper-util   = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Compiled-in Mozilla root set. Chosen over `rustls-native-certs` because a
# built-in trust anchor list does not depend on the runtime image shipping a
# CA bundle, which the distroless image does not guarantee. Carries
# CDLA-Permissive-2.0; see deny.toml for why that is allowed here.
webpki-roots = "1"
# Server-side TLS, for the LAN listener `sc-server`'s `tls.rs` puts up. Same
# rustls, same ring provider, so this adds an accept path and no second stack.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Generates that certificate on first start. Pinned to ring for the reason the
# rustls comment above gives: the default `aws-lc-rs` needs cmake and would
# break the musl check.
rcgen        = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# Lets `sc-oidc` wrap hyper's DNS resolver so the private-address rule is
# enforced on the addresses actually connected to, not on a separate lookup
# that a hostile IdP could rebind between. Already in the tree under
# hyper-util; named here only so the wrapper can implement its trait.
tower-service = "0.3"
# `HttpFetch` is swapped between the rustls implementation and the in-process
# test fake through `Arc<dyn HttpFetch>`, and a native `async fn` in a trait
# is not object safe on this workspace's 1.88 MSRV.
async-trait  = "0.1"

# --- syscalls / fs ---
rustix       = { version = "0.38", features = ["fs", "process", "thread"] }
cap-std      = "3"
libc         = "0.2"

# --- storage ---
rusqlite     = { version = "0.32", features = ["bundled", "blob"] }
r2d2         = "0.8"
r2d2_sqlite  = "0.25"

# --- crypto / hashing ---
blake3       = "1"
sha2         = "0.10"
hmac         = "0.12"
crc32c       = "0.6"
argon2       = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
chacha20poly1305 = "0.10"
totp-rs      = { version = "5", features = ["otpauth"] }
zeroize      = { version = "1", features = ["derive"] }
subtle       = "2"
# RS256 and ES256 signature verification for OIDC ID tokens, and the crypto
# provider rustls is pinned to below. One crate covers both, which is the
# whole reason `sc-oidc` needs no JWT library: `RsaPublicKeyComponents` and
# `UnparsedPublicKey<ECDSA_P256_SHA256_FIXED>` verify a JWS directly.
# License is `Apache-2.0 AND ISC`, both already on deny.toml's allow list.
ring         = "0.17"
getrandom    = "0.2"
base64       = "0.22"
data-encoding = "2"

# --- serde / encoding ---
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# `default-features = false`: postcard's default set pulls `heapless`, whose
# 0.7 line still depends on the unmaintained `atomic-polyfill`
# (RUSTSEC-2023-0089, no safe upgrade). Nothing here touches a heapless
# buffer — every call site is `to_allocvec`/`from_bytes` — so dropping the
# default features removes that subtree outright rather than ignoring it.
postcard     = { version = "1", default-features = false, features = ["alloc"] }
# 0.41, not 0.37: both RUSTSEC-2026-0194 (quadratic duplicate-attribute
# scan) and RUSTSEC-2026-0195 (unbounded namespace-declaration allocation in
# `NsReader`) are remotely reachable here — sc-dav parses PROPFIND/LOCK
# bodies straight off the wire, which is exactly the untrusted-XML case both
# advisories describe. 0.41 caps declarations per element and makes the
# duplicate scan O(N).
quick-xml    = { version = "0.41", features = ["serialize"] }
toml         = "0.8"
percent-encoding = "2"
httpdate     = "1"
# Promoted, not new: `url` was already in the tree as a transitive dependency
# of `totp-rs` (it parses `otpauth://` URIs). `sc-oidc` needs it directly to
# build the authorize URL and to inspect the scheme and host of every endpoint
# the discovery document hands us, so it gets a version this workspace owns
# rather than whichever one `totp-rs` happens to pull.
url          = "2"

# --- data structures ---
smallvec     = { version = "1", features = ["union", "const_generics"] }
compact_str  = { version = "0.8", features = ["serde"] }
dashmap      = "6"
# 0.18, not 0.12: RUSTSEC-2026-0002 — `IterMut` invalidated an internal
# pointer, violating Stacked Borrows. Fixed in 0.16.3.
lru          = "0.18"
parking_lot  = "0.12"
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
indexmap     = "2"

# --- compression / archives ---
zstd         = "0.13"
ruzstd       = "0.7"
zip          = { version = "2", default-features = false, features = ["deflate", "time"] }

# --- images ---
image        = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
infer        = "0.16"

# --- misc ---
bitflags     = { version = "2", features = ["serde"] }
secrecy      = "0.10"
md4          = "0.10"
hyperloglog  = "1"
unicode-normalization = "0.1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror    = "2"
anyhow       = "1"
clap         = { version = "4", features = ["derive", "env"] }
rust-embed   = { version = "8", features = ["mime-guess"] }
mime_guess   = "2"
uuid         = { version = "1", features = ["v4", "serde"] }
# 8, not 7: notify 7 reaches the unmaintained `instant` through
# `notify-types` (RUSTSEC-2024-0384, no safe upgrade on the 7 line).
notify       = "8"
rayon        = "1"
memmap2      = "0.9"
filetime     = "0.2"

# --- linux only ---
inotify      = "0.11"
landlock     = "0.4"
# musl only (`crates/sc-server/Cargo.toml`'s `[target.'cfg(target_env =
# "musl")'.dependencies]`) — DEPLOYMENT.md §1's mandated global allocator
# for the shipping musl target. See `crates/sc-server/src/main.rs` for the
# `#[global_allocator]` wiring and the measured (not asserted) before/after.
mimalloc     = "0.1"

# --- dev ---
tempfile     = "3"
proptest     = "1"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
