# Testbed stack, for the SELinux-enforcing guest.
#
#   docker compose -f deploy/testbed/docker-compose.dev.yml up -d --build
#
# The difference from compose.buildver.yml at the repository root is the bind
# mounts: this one puts the data and the shares in directories beside the file
# so a test can look at them from the host, where the root file uses named
# volumes to avoid needing any host-side setup at all.
#
# One-time setup, from this directory. The uid is the one the image runs as,
# and a bind mount does not inherit ownership the way a named volume does: a
# directory compose creates for a missing bind source is root-owned, and the
# first write fails with "unable to open database file".
#
#   mkdir -p data shares/files smbcfg
#   sudo chown -R 65532:65532 data shares smbcfg

name: sc-lab

services:
  sc:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: stowcloud:core-dev
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    volumes:
      # `:z` on every bind mount: this guest runs SELinux enforcing, where an
      # unlabelled host directory is unreachable from container_t.
      - ./data:/var/lib/stowcloud:z
      - ./sc.dev.toml:/etc/stowcloud/sc.toml:ro,z
      - ./shares/files:/shares/files:z
      - ./smbcfg:/config/smb:z
      - sc-smb-control:/run/sc-smb

    ports:
      # Loopback only: the testbed drives the API from inside the guest.
      - "127.0.0.1:8443:8443"

    stop_grace_period: 30s

    healthcheck:
      test: [CMD, /stowcloud, healthcheck, /etc/stowcloud/sc.toml]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  sc-smb:
    build:
      context: ../..
      dockerfile: Dockerfile.smb
    image: stowcloud:smb-dev
    profiles: [smb]
    restart: unless-stopped

    cap_drop: [ALL]
    # NET_ADMIN beyond the root file's set: this stack exercises the automatic
    # bans, which are firewall rules the sidecar writes in its own namespace.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, NET_ADMIN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true

    volumes:
      - ./smbcfg:/config/smb:ro,z
      - ./shares/files:/shares/files:z
      - sc-smb-control:/run/sc-smb

    # The host's own LAN address. 0.0.0.0 is refused for :445, and 127.0.0.1
    # puts SMB out of reach of every client but this guest.
    ports:
      - "${SC_SMB_BIND_IP:?set it to the guest's LAN address}:445:445"

    healthcheck:
      test: [CMD-SHELL, "smbd -b >/dev/null 2>&1 && pgrep -x smbd >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sc-smb-control:
