# Server config for the testbed stack. Every path is the container's.

[server]
data_dir = "/var/lib/stowcloud"
# The container's own address, not loopback: a published port targets the
# bridge interface, and TLS is the only thing this socket speaks.
listen = "0.0.0.0:8443"

[http]
# Host names only. The guard splits the port off the Host header before
# comparing, so an entry carrying one can never match. The stack publishes on
# the guest's loopback, so these are the only two literals that arrive.
app_hosts = ["127.0.0.1", "localhost"]
content_hosts = ["content.localhost"]

[rate]
# Well above production's, because the testbed drives the API in bursts and a
# limiter tripping mid-suite reads as a failure of whatever it was testing.
per_sec = 200
burst = 400

[security]
# The guest kernel has the layers, so this asks for all of them and refuses to
# start without: a testbed that silently ran unsandboxed would be testing a
# configuration nobody ships.
hardening = "required"

[[shares]]
name = "files"
host_path = "/shares/files"
trash_enabled = true

[smb]
# Off on purpose. Turning it on from the settings screen is the path a real
# deployment takes, and it exercises the render plus the push to the agent
# that a pre-enabled config file would skip.
enabled = false
workgroup = "WORKGROUP"
service_user = "scsvc"
config_dir = "/config/smb"
# Where the sidecar listens. Written down because it has to match the volume
# both services mount it on.
agent_socket = "/run/sc-smb/agent.sock"
