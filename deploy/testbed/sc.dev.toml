# Server config for the testbed compose stack. Paths are the container's.

# HTTPS, like every other deployment: this is the only listener and it always
# terminates TLS with a self-signed certificate written into `data_dir/tls`
# on first run (`Config::bind`).
bind = "0.0.0.0:8443"
data_dir = "/var/lib/sc"

# Hostnames only: `middleware::host_guard` splits the port off the Host
# header before comparing, so an entry carrying one can never match. The stack
# publishes 8443 on the guest's loopback only, so these are the only two
# literals that ever arrive.
app_hosts = ["127.0.0.1", "localhost"]
# Two `app_hosts` entries is ambiguous, so nothing is derived: without this the
# compat layer never mounted here at all, and every share link was a guess.
# The first entry is what an unrecognised `Host` is answered with.
public_origins = ["https://127.0.0.1:8443", "https://localhost:8443"]
# `allowed_origins` is deliberately absent. Left empty it is derived from
# `app_hosts` as `https://{host}` and `https://{host}:{bind port}`, which is
# exactly right here; the explicit `http://` list this used to carry became
# wrong the moment the plaintext listener went away, and spelling out a
# correct one would only be a second copy of something already derived.

master_key_file = "/run/sc-secrets/master.key"

[[shares]]
name = "photos"
host_path = "/shares/photos"

[[shares]]
name = "video"
host_path = "/shares/video"

[smb]
# Left off here on purpose: turning SMB on through
# `PATCH /api/admin/server-settings/smb` is the path a real deployment takes,
# and it exercises the in-process render + the sidecar's inotify reload that
# a pre-enabled config file would skip.
enabled = false
workgroup = "WORKGROUP"
config_dir = "/config/smb"
service_user = "scsvc"
