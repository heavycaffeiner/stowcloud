# fail2ban filter for smbd auth failures. Written for this project, not
# vendored from Debian/Alpine (neither fail2ban package ships one — see
# fail2ban-samba.local). Matched against real output captured from smbd
# 4.19 with `log level = 1 auth_audit:3` (entrypoint.sh's inject_logging):
#
#   Auth: [SMB2,(null)] user [WORKGROUP]\[alice] at [...] with [NTLMv2]
#   status [NT_STATUS_WRONG_PASSWORD] workstation [...]
#   remote host [ipv4:172.18.0.3:37156] mapped to [...]
#
# Verified against that exact line with `fail2ban-regex`: 1 match, host
# extracted correctly.
#
# Known limitation: only the `ipv4:` remote-host form is matched. Samba
# renders IPv6 clients as `ipv6:<addr>:<port>`, and a bare IPv6 address
# already contains colons, so "address, then :, then port" can't be split
# unambiguously by regex alone. SMB is LAN-only here
# and this is a defense-in-depth layer on top of that, not the boundary
# itself, so an IPv4-only ban list was judged an acceptable gap rather than
# worth a stateful parser.
[Definition]
failregex = ^.*Auth: \[.*\].*status \[NT_STATUS_(WRONG_PASSWORD|LOGON_FAILURE|NO_SUCH_USER|ACCOUNT_DISABLED|ACCOUNT_LOCKED_OUT|PASSWORD_EXPIRED|ACCOUNT_RESTRICTION)\].*remote host \[(?:ipv4:)?<HOST>:\d+\].*$
ignoreregex =
