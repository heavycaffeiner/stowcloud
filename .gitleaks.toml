# Scanner policy.
#
# There is no allowlist, and that is the point worth writing down: nothing in
# this tree commits key material. The OIDC tests need RSA and ECDSA keys to
# sign with, and Go's standard library generates them at test time, so there is
# no committed blob for a scanner to trip over and no path to exempt.
#
# An earlier revision carried a path allowlist for three committed DER files.
# Those are gone, and the allowlist went with them rather than being left
# pointing at paths that no longer exist: an exemption nobody can see the
# subject of is one that quietly covers whatever is put there next.
#
# This governs gitleaks only. GitHub's own secret scanning does not read it.

[extend]
useDefault = true

# go/deps.allow is prose: one line per dependency and the reason it is there.
# The generic high-entropy rule reads a comment naming three cipher
# constructions as a credential. Scoped to the one file, and that file holds no
# values at all, only module paths and sentences.
[[allowlists]]
description = "the dependency allow-list is prose, not values"
paths = ['''^go/deps\.allow$''']
