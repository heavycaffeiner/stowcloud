# Scanner policy.
#
# No key material is committed here. The OIDC tests need RSA and ECDSA keys to
# sign with, and Go's standard library generates them at test time, so there is
# no committed blob for a scanner to trip over.
#
# The two allowlists below name values, never paths. A path exemption silences
# whatever is put in that file next, including a real secret nobody meant to
# commit; a value exemption stops covering anything the moment the value
# changes. Each is one literal string, written out so a reader can see exactly
# what is exempt and check the claim about it.
#
# This governs gitleaks only. GitHub's own secret scanning does not read it.

[extend]
useDefault = true

# "XChaCha20-Poly1305", in a sentence naming the three constructions
# golang.org/x/crypto is depended on for. The generic high-entropy rule reads
# the cipher's name as a credential.
[[allowlists]]
description = "a cipher construction named in prose, not a value"
regexTarget = "match"
regexes = ['''XChaCha20-Poly1305''']

# The TOTP reference vector from RFC 6238's appendix: the ASCII digits
# "12345678901234567890" in Base32. Every implementation checks itself against
# it, and the high-entropy rule reads its Base32 spelling as a credential.
[[allowlists]]
description = "the TOTP reference vector is published, not a credential"
regexTarget = "match"
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']
