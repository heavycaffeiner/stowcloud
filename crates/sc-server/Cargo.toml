[package]
name = "sc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Main binary: assembles every sc-* crate into `sc-server`. See docs/ARCHITECTURE.md §1, DEPLOYMENT.md,"

[[bin]]
name = "sc-server"
path = "src/main.rs"

[[bin]]
name = "sc-caps"
path = "src/bin/sc-caps.rs"

[features]
# Gates the legacy-client compatibility layer entirely out of the binary
# (`ARCHITECTURE.md` §1/§10.1). `--no-default-features` drops the dependency
# itself, not merely the route registrations, which is what makes the
# isolation gate ("that binary must contain zero NC routes") provable rather
# than asserted.
default = ["compat-nc", "oidc"]
compat-nc = ["dep:sc-compat-nc"]
# OpenID Connect login (`docs/proposals/stowcloud-0-oidc-login.md` §4.1.1).
# **On by default, deliberately.** The tempting layout is opt-in, but
# `cargo clippy --all-targets` -- this repo's hard gate -- only ever compiles
# what the default feature set turns on, so an off-by-default relying party is
# a relying party nobody ever compiles, and it rots silently. `sc-oidc`'s own
# `net` feature makes the same call for the same reason.
#
# `--no-default-features` drops the dependency itself, not merely the
# registrations: rustls, hyper's client, `ring` and the compiled-in root
# certificates all leave the binary. The eight routes stay, and answer
# `oidc.disabled` -- which is exactly what a deployment with no IdP sees.
oidc = ["dep:sc-oidc", "dep:async-trait"]
# Embeds the built frontend (`web/build`) into the binary and serves it —
# `ARCHITECTURE.md` §7 /'s "single static binary".
# Not in `default`: `web/build` is `.gitignore`d, so a fresh checkout has
# none, and `sc-http`'s `embed-ui` (which this forwards to) embeds that
# folder's contents at *compile* time via `#[derive(RustEmbed)]` — turning
# this on by default would break `cargo build` on exactly the checkout this
# crate's own doc comment above promises still works. Build the frontend
# first (`cd web && npm run build`), then `cargo build -p sc-server --release
# --features embed-ui` for the real, UI-carrying binary.
embed-ui = ["sc-http/embed-ui"]

[dependencies]
sc-vfs  = { path = "../sc-vfs" }
sc-meta = { path = "../sc-meta" }
sc-auth = { path = "../sc-auth" }
sc-acl  = { path = "../sc-acl" }
sc-smb  = { path = "../sc-smb" }
sc-core = { path = "../sc-core" }
sc-http = { path = "../sc-http" }
sc-upload = { path = "../sc-upload" }
sc-search = { path = "../sc-search" }
sc-preview = { path = "../sc-preview" }
sc-watch = { path = "../sc-watch" }
# `sqlite` is enabled here, not upstream: those crates keep it optional so
# their own `cargo check --target x86_64-unknown-linux-musl` doesn't need a C
# cross-compiler for `rusqlite/bundled`. This binary links SQLite anyway.
sc-dav  = { path = "../sc-dav", features = ["sqlite"] }
sc-compat-nc = { path = "../sc-compat-nc", features = ["sqlite"], optional = true }
# The relying party. Its own `net` feature (the rustls-backed `HttpFetch`) is
# on by default, so this edge is what pulls the whole outbound TLS stack in --
# and what `--no-default-features` removes.
sc-oidc = { path = "../sc-oidc", optional = true }
# `oidc::active::OidcBridge` only, implementing `sc_http::oidc_api::OidcApi`.
# Optional for the same reason `sc-oidc` is: with the feature off there is no
# trait impl to write and nothing pulls this in.
async-trait = { workspace = true, optional = true }

tokio   = { workspace = true }
axum    = { workspace = true }
tower   = { workspace = true }
# `trace` (among the features the workspace already enables) is
# `tower_http::trace::TraceLayer` — production request logging, added in
# `app.rs::router()`. Nothing emitted a per-request line before this; see
# that file for why production logs were otherwise silent by default.
tower-http = { workspace = true }
http    = { workspace = true }

clap    = { workspace = true }
serde   = { workspace = true }
serde_json = { workspace = true }
toml    = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow  = { workspace = true }
parking_lot = { workspace = true }
# `settings_store.rs` — same tiny own-DB-file pattern as `sc-upload`'s
# `upload_chunk_settings` / `sc-search`'s `IndexSettingsStore`.
rusqlite = { workspace = true }
secrecy = { workspace = true }
crossbeam-channel = { workspace = true }
percent-encoding = { workspace = true }

getrandom = { workspace = true }
data-encoding = { workspace = true }
# Already a workspace dependency (sc-core's own directory-aggregate etag,
# `aggregate.rs`) — used here for the synthetic files-root collection's
# `getetag`, hashed over its children's `(label, etag)` pairs the same way.
blake3 = { workspace = true }
# Already a workspace dependency (sc-auth, sc-http, sc-compat-nc). The
# first-run setup token is compared with `ct_eq`, exactly as the share-link
# password and signed-URL signature checks are.
subtle = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix   = { workspace = true }
landlock = { workspace = true }

# DEPLOYMENT.md §1's mandated global allocator, scoped to the target the doc
# is actually about: musl's default allocator, not glibc's (`src/main.rs`
# has the `#[global_allocator]` wiring, the reasoning for the cfg gate, and
# the measurements behind both). Being a
# target-specific dependency table (matching the `cfg(target_os = "linux")`
# one above) means native Windows dev builds and the `ubuntu-latest` glibc
# CI job never pull in `mimalloc` or need its build script's C toolchain at
# all — only `x86_64-unknown-linux-musl` / `aarch64-unknown-linux-musl` do.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
