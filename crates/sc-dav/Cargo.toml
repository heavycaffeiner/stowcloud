[package]
name = "sc-dav"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "RFC 4918 Class 2 + RFC 4331 WebDAV server. Protocol-pure — no vendor vocabulary."

[features]
default = []
# SQLite-backed lock persistence. Off by default because `rusqlite/bundled`
# needs a C toolchain for every target, which breaks
# `cargo check --target x86_64-unknown-linux-musl` on a machine that has no
# musl cross-cc. Enable it in the server binary, which already links SQLite.
sqlite = ["dep:rusqlite"]

[dependencies]
sc-vfs = { path = "../sc-vfs" }
# `Perms` only — see backend.rs. `sc-acl` is a core crate with no protocol
# vocabulary in it, so this does not compromise "sc-dav is protocol-pure".
sc-acl = { path = "../sc-acl" }

axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

quick-xml = { workspace = true }
uuid = { workspace = true }
httpdate = { workspace = true }
percent-encoding = { workspace = true }
mime_guess = { workspace = true }

bitflags = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

rusqlite = { workspace = true, optional = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
proptest = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
