[package]
name = "sc-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Kernel-handle based safe filesystem layer. Security core of stowcloud."

[dependencies]
smallvec = { workspace = true }
compact_str = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
unicode-normalization = { workspace = true }

# Linux is the deployment target: openat2/statx/renameat2/getdents64 via rustix.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

# Portable dev-convenience backend (Windows/macOS/other Unix): std::fs based
# component walk. filetime is needed because std has no portable mtime setter.
[target.'cfg(not(target_os = "linux"))'.dependencies]
filetime = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
