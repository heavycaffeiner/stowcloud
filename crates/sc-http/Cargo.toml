[package]
name = "sc-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native REST API + WebSocket + middleware stack for the web UI. Zero compat-protocol vocabulary — see."

[features]
default = []
# Embeds the built frontend (the built frontend) via rust-embed. Off by default so the
# crate builds before the frontend exists.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]
# Exposes `testutil` (a real-but-minimal AppState builder) to other crates'
# integration tests, e.g. sc-server. Always on for `cfg(test)` within this
# crate regardless of this feature.
test-support = []

[dependencies]
sc-vfs   = { path = "../sc-vfs" }
sc-acl   = { path = "../sc-acl" }
sc-auth  = { path = "../sc-auth" }

axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
http         = { workspace = true }
http-body-util = { workspace = true }
bytes        = { workspace = true }
futures      = { workspace = true }
tokio        = { workspace = true }
# `oidc_api::OidcApi` only. It is behind `Arc<dyn ...>` (the real relying
# party lives in `sc-server`, the scripted fakes in this crate's tests), and a
# native `async fn` in a trait is not object safe on this workspace's 1.88
# MSRV. Already in the tree via `sc-oidc`.
async-trait  = { workspace = true }

serde        = { workspace = true }
serde_json   = { workspace = true }
postcard     = { workspace = true }

hmac         = { workspace = true }
sha2         = { workspace = true }
subtle       = { workspace = true }
base64       = { workspace = true }
getrandom    = { workspace = true }
data-encoding = { workspace = true }
percent-encoding = { workspace = true }
secrecy      = { workspace = true }

dashmap      = { workspace = true }
lru          = { workspace = true }
parking_lot  = { workspace = true }
smallvec     = { workspace = true }
compact_str  = { workspace = true }

uuid         = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
rusqlite     = { workspace = true }

rust-embed   = { workspace = true, optional = true }
mime_guess   = { workspace = true, optional = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["test-util"] }
tempfile     = { workspace = true }
http-body-util = { workspace = true }
# Round-trip verification only: parse what `archive_zip::ZipStreamWriter`
# produces with an independent, seek-based reader. Never used to *write* —
# that's the whole reason `archive_zip` is hand-rolled (see its module doc).
zip          = { workspace = true }
