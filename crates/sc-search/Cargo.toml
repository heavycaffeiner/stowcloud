[package]
name = "sc-search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Parallel filesystem walker (T2) + block-compressed trigram name index (T3) + index estimator. See docs/."

[dependencies]
sc-vfs = { path = "../sc-vfs" }

anyhow = { workspace = true }
thiserror = { workspace = true }
compact_str = { workspace = true }
crossbeam-deque = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }

# Admin-persisted "name index enabled" override (`settings.rs`) — same
# `rusqlite` build already linked into `sc-core`/`sc-upload`.
rusqlite = { workspace = true }

# Block compression for base.idx (§4.1). The C binding is fine here: this is
# our own index format, not untrusted user content.
# "pure Rust decoders only" rule is about image/document parsers.
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
