[package]
name = "sc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Domain API assembled from sc-vfs + sc-meta + sc-acl. Protocol-agnostic."

[dependencies]
sc-vfs      = { path = "../sc-vfs" }
sc-meta     = { path = "../sc-meta" }
sc-acl      = { path = "../sc-acl" }
# Share-link passwords reuse `sc-auth`'s Argon2id parameters rather than
# inventing a second set (`links.rs`, `DESIGN-PREVIEW.md` §7.1). The arrow is
# the sanctioned direction: `ARCHITECTURE.md` §1 lists `sc-auth` above
# `sc-core` ("domain API assembled from the above"), and `sc-auth` depends on
# `sc-vfs` only, so there is no cycle.
sc-auth     = { path = "../sc-auth" }

anyhow      = { workspace = true }
thiserror   = { workspace = true }
blake3      = { workspace = true }
dashmap     = { workspace = true }
lru         = { workspace = true }
parking_lot = { workspace = true }
smallvec    = { workspace = true }
uuid        = { workspace = true }
tracing     = { workspace = true }

# Share-link store (`links.rs`). `rusqlite/bundled` is already linked into
# every build of this crate through `sc-meta`, so this adds no new C
# toolchain requirement for the musl cross-check.
rusqlite    = { workspace = true }
r2d2        = { workspace = true }
r2d2_sqlite = { workspace = true }
sha2        = { workspace = true }
getrandom   = { workspace = true }
data-encoding = { workspace = true }
secrecy     = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `faccessat2`/`faccessat` probe on share registration (`share.rs`,
# item 45) — real access check, not a `stat`-mode-bits guess.
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
