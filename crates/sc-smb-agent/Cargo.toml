[package]
name = "sc-smb-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Applies what sc-server renders for Samba: network scope, testparm, passdb, smbd. Runs beside smbd, not beside sc-core."

[dependencies]
# The rendered-file contract and the control protocol, shared with sc-server
# so the two halves cannot disagree about either.
sc-smb = { path = "../sc-smb" }

clap        = { workspace = true }
libc        = { workspace = true }
parking_lot = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
