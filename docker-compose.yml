# Stowcloud, released images.
#
#   docker compose up -d
#
# Then open https://localhost:8443 and use the setup token from the log:
#
#   docker compose logs sc | grep 'setup token'
#
# The certificate is generated on first run and signed by nobody, so the
# browser warns once. That is the expected state for an address with no public
# name; put a reverse proxy in front for a real certificate.
#
# Files go in ./shares. Everything else lives in a named volume, and every
# other setting is on the admin screen rather than in a file.

services:
  sc:
    image: ghcr.io/heavycaffeiner/stowcloud:core-stable
    restart: unless-stopped

    # Read-only root with a small tmpfs. The server writes only to its data
    # directory, which is the volume below.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      # Docker's default seccomp profile allows openat2 from 20.10.0 on. An
      # older profile refuses it, and this server resolves every path with it
      # and will not start without it. Upgrade rather than granting anything
      # here.
      - no-new-privileges:true

    # Left at the image's own uid on purpose. The base puts the working
    # directory at /home/nonroot, mode 700 owned by 65532, so a `user:` set to
    # anything else lands in a directory it cannot search. Override this only
    # together with `working_dir: /`.

    ports:
      # TLS, always. There is no plaintext listener to publish by mistake.
      # Change the left side to 127.0.0.1:8443 to keep it off the LAN.
      - "8443:8443"

    volumes:
      # The store, the master key and the certificate. A named volume so it
      # needs no host-side preparation: the image ships this directory owned by
      # the uid the server runs as, and the volume inherits that.
      - sc-data:/var/lib/stowcloud

      # The configuration. Read-only to the server; it is yours, and nothing in
      # the container writes it. Copy it out to change it:
      #
      #   cp deploy/sc.quickstart.toml ./sc.toml
      #
      # then point this line at ./sc.toml.
      - ./deploy/sc.quickstart.toml:/etc/stowcloud/sc.toml:ro,z

      # The folder being served. A named volume, so this starts with no host
      # preparation at all: a bind mount whose source does not exist yet is
      # created root-owned, and the server does not run as root.
      #
      # To serve a directory you already have, replace this with a bind mount
      # and make sure it is readable and writable by uid 65532:
      #
      #   - /srv/my-files:/shares/files:z
      #
      # Lowercase z, never uppercase: the exclusive label would cut off
      # anything else on the host that uses the same directory.
      - sc-files:/shares/files

      # Where the server renders the SMB configuration. Harmless when SMB is
      # off, and the sidecar reads the same volume.
      - sc-smb-config:/config/smb
      - sc-smb-control:/run/sc-smb

    # Uploads in flight get this long to finish before the process is killed.
    stop_grace_period: 30s

    healthcheck:
      # The same binary under a different argument, because the image has no
      # shell to run anything else with. It exits zero for degraded as well as
      # ok: degraded is a configuration state, and restarting does not fix one.
      test: [CMD, /stowcloud, healthcheck, /etc/stowcloud/sc.toml]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Windows and macOS file sharing. Off unless asked for:
  #
  #   docker compose --profile smb up -d
  #
  # It also needs smb.enabled on the admin screen, or in the config file. The
  # server renders the configuration and this container applies it, which is
  # why they share two directories.
  sc-smb:
    image: ghcr.io/heavycaffeiner/stowcloud:smb-stable
    profiles: [smb]
    restart: unless-stopped

    # Name service is broadcast and does not cross a bridge, so \\NAME only
    # resolves when this shares the host's network. It also means another SMB
    # server already on port 445 wins and this fails to start.
    #
    # For a bridged sidecar instead, drop this and publish 445 on a specific
    # LAN address. The name stops working; the address still mounts.
    network_mode: host

    cap_drop: [ALL]
    # Dropping everything strips these from root too, and smbd needs them back:
    # to bind its privileged port, to become the service account per
    # connection, and to read a credential file owned by another uid.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true

    volumes:
      - sc-smb-config:/config/smb:ro
      - sc-smb-control:/run/sc-smb
      # Every share the server knows has to exist here under the same path, or
      # the client is told the network name is invalid while the server side
      # looks correct. Whatever the service above mounts, mount here too.
      - sc-files:/shares/files

    healthcheck:
      test: [CMD-SHELL, "smbd -b >/dev/null 2>&1 && pgrep -x smbd >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sc-data:
  # The served files. Reachable from the host with `docker compose cp`, or
  # swap it for a bind mount as described above.
  sc-files:
  # The rendered SMB configuration. The server writes it, the sidecar reads it,
  # and republishing is how a revoked credential stops working over SMB.
  sc-smb-config:
  # The sidecar's control socket. Root-owned, which an empty named volume is
  # and an operator-made directory is not, and it keeps the socket off the host
  # filesystem so only these two containers can reach it.
  sc-smb-control:
