version = 1
revision = 1
requires-python = ">=3.11"

[[package]]
name = "certifi"
version = "2026.10.19"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "charset-normalizer"
version = "3.3.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "idna"
version = "3.15"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "iniconfig"
version = "2.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "packaging"
version = "24.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pluggy"
version = "1.5.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.7.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pydantic-core" },
]

[[package]]
name = "pydantic-core"
version = "2.18.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pygments"
version = "2.20.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "9.0.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
    { name = "packaging" },
    { name = "pluggy" },
    { name = "pygments" },
]

[[package]]
name = "requests"
version = "2.33.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "charset-normalizer" },
    { name = "idna" },
    { name = "urllib3" },
]

[[package]]
name = "urllib3"
version = "2.8.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "websockets"
version = "12.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "stowcloud-jev-e2e"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "certifi" },
    { name = "idna" },
    { name = "pydantic" },
    { name = "requests" },
    { name = "urllib3" },
    { name = "websockets" },
]

[package.optional-dependencies]
dev = [
    { name = "pygments" },
    { name = "pytest" },
]
