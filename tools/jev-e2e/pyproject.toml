[project]
name = "stowcloud-jev-e2e"
version = "0.1.0"
description = "Jev-Ultrafast agentic exploration runtime for Stowcloud"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "idna>=3.15",
    "pydantic>=2.7.0",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stowcloud_agent"]
