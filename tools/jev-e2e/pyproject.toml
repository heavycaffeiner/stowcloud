[project]
name = "stowcloud-jev-e2e"
version = "0.1.0"
description = "Jev-Ultrafast agentic exploration runtime for Stowcloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
